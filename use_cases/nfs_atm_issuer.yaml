id: nfs_atm_issuer
name: "Card at ATM — Bank as Issuer via NFS"
description: "Customer uses card at an ATM. Bank is the card issuer. NFS acts as the switch between acquiring bank and issuing bank."
domain: card
channel: atm
bank_role: issuer
network: NFS
status: placeholder

participant_files:
  - id: nfs
    name: NFS Interchange File
    format: nfs_interchange
    description: "NFS switch settlement file listing all transactions routed through NFS"
  - id: switch_tlf
    name: Switch TLF (BASE24)
    format: switch_tlf
    description: "BASE24 Transaction Log File from the ATM switch processor"
  - id: cbs
    name: Bank CBS Export (EX3198)
    format: cbs_ex3198
    description: "Core Banking System transaction export file"

linkage_keys:
  primary: rrn
  secondary: card_pan
  tertiary: tran_date

mutation_matrix:
  amount:
    - id: amt_baseline
      label: "Amount match"
      deltas: {}
    - id: amt_net_higher
      label: "NFS higher (+500 Rs)"
      deltas:
        nfs: 50000
    - id: amt_net_lower
      label: "NFS lower (-500 Rs)"
      deltas:
        nfs: -50000
    - id: amt_sw_higher
      label: "Switch higher (+200 Rs)"
      deltas:
        switch_tlf: 20000
    - id: amt_sw_lower
      label: "Switch lower (-200 Rs)"
      deltas:
        switch_tlf: -20000
    - id: amt_cbs_higher
      label: "CBS higher (+500 Rs)"
      deltas:
        cbs: 50000
    - id: amt_cbs_lower
      label: "CBS lower (-500 Rs)"
      deltas:
        cbs: -50000
    - id: amt_fx_rounding
      label: "FX rounding (1 paise diff)"
      deltas:
        nfs: -1
  date:
    - id: date_baseline
      label: "Date match"
      offsets: {}
    - id: date_cbs_d1
      label: "CBS date +1"
      offsets:
        cbs: 1
    - id: date_sw_d1
      label: "Switch date +1"
      offsets:
        switch_tlf: 1
    - id: date_net_d1
      label: "NFS date +1"
      offsets:
        nfs: 1
  duplicate:
    - id: dup_none
      label: "No duplicate"
      dup_files: []
    - id: dup_net
      label: "NFS duplicate"
      dup_files: [nfs]
    - id: dup_sw
      label: "Switch duplicate"
      dup_files: [switch_tlf]
    - id: dup_cbs
      label: "CBS duplicate"
      dup_files: [cbs]

scenarios:

  - id: case_01
    name: "C01 — NFS:fwd SW:fwd CBS:fwd"
    case_matrix_id: 1
    action: "OK"
    is_ok: true
    weight: 20
    file_states:
      nfs: 1
      switch_tlf: 1
      cbs: 1

  - id: case_02
