id: visa_pos_issuer
name: "VISA POS + Cash — Bank as Issuer"
description: "Customer uses a VISA card at a POS terminal or ATM. Bank is the card issuer. VISA VisaNet routes the clearing file. Switch TLF logs the authorization; CBS records the debit."
domain: card
channel: pos_atm
bank_role: issuer
network: VISA
status: placeholder

participant_files:
  - id: visa_tc
    name: VISA T&E Clearing File
    format: visa_tc05
    description: "VISA VisaNet clearing file with 4 records per transaction (TCSN 0/1/5/7). TC=05 for POS, TC=07 for Cash."
  - id: switch_tlf
    name: Switch TLF (BASE24)
    format: switch_tlf
    description: "BASE24 Transaction Log File from the authorization switch."
  - id: cbs
    name: Bank CBS Export (EX3198)
    format: cbs_ex3198
    description: "Core Banking System transaction export."

linkage_keys:
  primary: arn
  secondary: card_pan
  tertiary: tran_date

mutation_matrix:
  amount:
    - id: amt_baseline
      label: "Amount match"
      deltas: {}
    - id: amt_visatc_higher
      label: "VISA TC higher (+500 Rs)"
      deltas:
        visa_tc: 50000
    - id: amt_visatc_lower
      label: "VISA TC lower (-500 Rs)"
      deltas:
        visa_tc: -50000
    - id: amt_sw_higher
      label: "Switch higher (+200 Rs)"
      deltas:
        switch_tlf: 20000
    - id: amt_sw_lower
      label: "Switch lower (-200 Rs)"
      deltas:
        switch_tlf: -20000
    - id: amt_cbs_higher
      label: "CBS higher (+500 Rs)"
      deltas:
        cbs: 50000
    - id: amt_cbs_lower
      label: "CBS lower (-500 Rs)"
      deltas:
        cbs: -50000
    - id: amt_fx_rounding
      label: "FX rounding (1 paise diff)"
      deltas:
        visa_tc: -1
  date:
    - id: date_baseline
      label: "Date match"
      offsets: {}
    - id: date_cbs_d1
      label: "CBS date +1"
      offsets:
        cbs: 1
    - id: date_sw_d1
      label: "Switch date +1"
      offsets:
        switch_tlf: 1
    - id: date_visatc_d1
      label: "VISA TC date +1"
      offsets:
        visa_tc: 1
  duplicate:
    - id: dup_none
      label: "No duplicate"
      dup_files: []
    - id: dup_visatc
      label: "VISA TC duplicate"
      dup_files: [visa_tc]
    - id: dup_sw
      label: "Switch duplicate"
      dup_files: [switch_tlf]
    - id: dup_cbs
      label: "CBS duplicate"
      dup_files: [cbs]

