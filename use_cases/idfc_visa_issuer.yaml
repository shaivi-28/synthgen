id: idfc_visa_issuer
name: "Visa Cards Issuer — ATM & POS"
bank: idfc
network: VISA
status: active
description: >
  IDFC FIRST Bank as VISA card issuer. Generates 8 files per run:
  CBSMCW, FSSGL, EPIN DOM/INT, TLF, PTLF, EP747 DOM/INT.
  All scenarios run in exhaustive mode by default.

# ── Scenario Groups ────────────────────────────────────────────────────
# A  — Perfect Match (OK)
# B  — Single Full Reversal Same Day
# C  — Reversal on Different Day
# D  — Partial Reversal
# E  — Multiple Reversals
# F  — Installment / Split Billing
# G  — Disputes / Chargeback
# H  — Fee Transactions
# I  — Amount Mismatches
# J  — Date Mismatches (J01-J14)
# K  — Duplicates & Double Debit
# L  — Missing Files (L01-L18)
# M  — Crossfire / Direction Mismatch (M01-M09)

participant_files:
  - id: epin
    name: EPIN
    description: "VISA T&E Clearing File (settlement flag 8=DOM, 0=INT)"
  - id: tlf
    name: TLF
    description: "ATM Switch Transaction Log (864-char × 4 records)"
  - id: ptlf
    name: PTLF
    description: "POS Switch Transaction Log (~860-char × 2 records)"
  - id: cbsmcw
    name: CBSMCW
    description: "CBS Card-Level Transaction File (pipe-delimited)"
  - id: fssgl
    name: FSSGL
    description: "CBS GL Settlement File (pipe-delimited)"
  - id: ep747_dom
    name: "EP747 DOM"
    description: "VISA VSS Settlement Report — Domestic"
  - id: ep747_int
    name: "EP747 INT"
    description: "VISA VSS Settlement Report — International"

linkage_keys:
  primary: rrn
  secondary: auth_code
  tertiary: card_pan

scenarios:

  # ══════════════════════════════════════════════════════════════════
  # GROUP A — PERFECT MATCH
  # All files present; amounts and dates exactly aligned.
  # Outcome: Reconciled OK
  # ══════════════════════════════════════════════════════════════════

  - id: a01_dom_atm_ok
    code: A01
    group: A
    name: "DOM ATM — Perfect Match"
    tran_type: ATM
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 1, tlf: 1, cbsmcw: 1, fssgl: 1}
    action: OK
    is_ok: true
    weight: 20

  - id: a02_int_atm_ok
    code: A02
    group: A
    name: "INT ATM — Perfect Match"
    tran_type: ATM
    tran_category: I
    coverage: [exhaustive]
    file_states: {epin: 1, tlf: 1, cbsmcw: 1, fssgl: 1}
    action: OK
    is_ok: true
    weight: 15

  - id: a03_dom_pos_ok
    code: A03
    group: A
    name: "DOM POS — Perfect Match"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: 1, fssgl: 1}
    action: OK
    is_ok: true
    weight: 15

  - id: a04_int_pos_ok
    code: A04
    group: A
    name: "INT POS — Perfect Match"
    tran_type: POS
    tran_category: I
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: 1, fssgl: 1}
    action: OK
    is_ok: true
    weight: 12

  - id: a05_dom_mc_ok
    code: A05
    group: A
    name: "DOM Merchandise Credit — Perfect Match"
    tran_type: MERCH_CR
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: 1, fssgl: 1}
    action: OK
    is_ok: true
    weight: 8

  - id: a06_int_mc_ok
    code: A06
    group: A
    name: "INT Merchandise Credit — Perfect Match"
    tran_type: MERCH_CR
    tran_category: I
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: 1, fssgl: 1}
    action: OK
    is_ok: true
    weight: 5

  # ══════════════════════════════════════════════════════════════════
  # GROUP B — SINGLE FULL REVERSAL SAME DAY
  # All files carry the reversal (or purchase+reversal) on the same date.
  # Outcome: Reconciled OK
  # ══════════════════════════════════════════════════════════════════

  - id: b01_dom_atm_rev
    code: B01
    group: B
    name: "DOM ATM — Full Reversal Only (same day)"
    tran_type: ATM
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: -1, tlf: -1, cbsmcw: -1, fssgl: -1}
    action: OK_REVERSAL
    is_ok: true
    weight: 3

  - id: b02_int_atm_rev
    code: B02
    group: B
    name: "INT ATM — Full Reversal Only (same day)"
    tran_type: ATM
    tran_category: I
    coverage: [exhaustive]
    file_states: {epin: -1, tlf: -1, cbsmcw: -1, fssgl: -1}
    action: OK_REVERSAL
    is_ok: true
    weight: 2

  - id: b03_dom_pos_rev
    code: B03
    group: B
    name: "DOM POS — Full Reversal Only (same day)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: -1, ptlf: -1, cbsmcw: -1, fssgl: -1}
    action: OK_REVERSAL
    is_ok: true
    weight: 3

  - id: b04_int_pos_rev
    code: B04
    group: B
    name: "INT POS — Full Reversal Only (same day)"
    tran_type: POS
    tran_category: I
    coverage: [exhaustive]
    file_states: {epin: -1, ptlf: -1, cbsmcw: -1, fssgl: -1}
    action: OK_REVERSAL
    is_ok: true
    weight: 2

  - id: b05_dom_atm_fwd_rev
    code: B05
    group: B
    name: "DOM ATM — Purchase + Full Reversal (same batch)"
    tran_type: ATM
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 0, tlf: 0, cbsmcw: 0, fssgl: 0}
    action: OK_WITH_REVERSAL
    is_ok: true
    weight: 3

  - id: b06_int_atm_fwd_rev
    code: B06
    group: B
    name: "INT ATM — Purchase + Full Reversal (same batch)"
    tran_type: ATM
    tran_category: I
    coverage: [exhaustive]
    file_states: {epin: 0, tlf: 0, cbsmcw: 0, fssgl: 0}
    action: OK_WITH_REVERSAL
    is_ok: true
    weight: 2

  - id: b07_dom_pos_fwd_rev
    code: B07
    group: B
    name: "DOM POS — Purchase + Full Reversal (same batch)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 0, ptlf: 0, cbsmcw: 0, fssgl: 0}
    action: OK_WITH_REVERSAL
    is_ok: true
    weight: 3

  - id: b08_int_pos_fwd_rev
    code: B08
    group: B
    name: "INT POS — Purchase + Full Reversal (same batch)"
    tran_type: POS
    tran_category: I
    coverage: [exhaustive]
    file_states: {epin: 0, ptlf: 0, cbsmcw: 0, fssgl: 0}
    action: OK_WITH_REVERSAL
    is_ok: true
    weight: 2

  - id: b09_dom_mc_rev
    code: B09
    group: B
    name: "DOM Merchandise Credit — Reversal Only (same day)"
    tran_type: MERCH_CR
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: -1, ptlf: -1, cbsmcw: -1, fssgl: -1}
    action: OK_REVERSAL
    is_ok: true
    weight: 2

  - id: b10_dom_mc_fwd_rev
    code: B10
    group: B
    name: "DOM Merchandise Credit — Credit + Reversal (same batch)"
    tran_type: MERCH_CR
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 0, ptlf: 0, cbsmcw: 0, fssgl: 0}
    action: OK_WITH_REVERSAL
    is_ok: true
    weight: 1

  # ══════════════════════════════════════════════════════════════════
  # GROUP C — REVERSAL ON DIFFERENT DAY
  # Reversal is processed/posted on a different calendar date from
  # the original purchase or from other files.
  # Outcome: DATE_MISMATCH (exception)
  # ══════════════════════════════════════════════════════════════════

  - id: c01_dom_atm_rev_cbs_d1
    code: C01
    group: C
    name: "DOM ATM — Reversal CBS Date D+1 (EPIN/TLF on D)"
    tran_type: ATM
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: -1, tlf: -1, cbsmcw: -1, fssgl: -1}
    date_delta: {cbsmcw: 1, fssgl: 1}
    action: DATE_MISMATCH
    is_ok: false
    weight: 6

  - id: c02_dom_pos_rev_cbs_d1
    code: C02
    group: C
    name: "DOM POS — Reversal CBS Date D+1 (EPIN/PTLF on D)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: -1, ptlf: -1, cbsmcw: -1, fssgl: -1}
    date_delta: {cbsmcw: 1, fssgl: 1}
    action: DATE_MISMATCH
    is_ok: false
    weight: 6

  - id: c03_int_atm_rev_cbs_d1
    code: C03
    group: C
    name: "INT ATM — Reversal CBS Date D+1"
    tran_type: ATM
    tran_category: I
    coverage: [exhaustive]
    file_states: {epin: -1, tlf: -1, cbsmcw: -1, fssgl: -1}
    date_delta: {cbsmcw: 1, fssgl: 1}
    action: DATE_MISMATCH
    is_ok: false
    weight: 4

  - id: c04_int_pos_rev_cbs_d1
    code: C04
    group: C
    name: "INT POS — Reversal CBS Date D+1"
    tran_type: POS
    tran_category: I
    coverage: [exhaustive]
    file_states: {epin: -1, ptlf: -1, cbsmcw: -1, fssgl: -1}
    date_delta: {cbsmcw: 1, fssgl: 1}
    action: DATE_MISMATCH
    is_ok: false
    weight: 4

  - id: c05_dom_pos_rev_cbs_d3
    code: C05
    group: C
    name: "DOM POS — Reversal CBS Date D+3 (very late posting)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: -1, ptlf: -1, cbsmcw: -1, fssgl: -1}
    date_delta: {cbsmcw: 3, fssgl: 3}
    action: DATE_MISMATCH
    is_ok: false
    weight: 4

  - id: c06_dom_atm_rev_epin_d1
    code: C06
    group: C
    name: "DOM ATM — Reversal EPIN Date D+1 (CBS/TLF on D)"
    tran_type: ATM
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: -1, tlf: -1, cbsmcw: -1, fssgl: -1}
    date_delta: {epin: 1}
    action: DATE_MISMATCH
    is_ok: false
    weight: 4

  # ══════════════════════════════════════════════════════════════════
  # GROUP D — PARTIAL REVERSAL
  # Reversal amount is different (less or more) than the original
  # purchase amount. CBS has the reversal; EPIN/switch have the
  # original forward transaction for comparison.
  # Outcome: PARTIAL_REVERSAL / OVER_REVERSAL (exception)
  # ══════════════════════════════════════════════════════════════════

  - id: d01_dom_pos_partial_rev_lt
    code: D01
    group: D
    name: "DOM POS — Partial Reversal, Rev Amount < Purchase"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 0, ptlf: 0, cbsmcw: -1, fssgl: -1}
    amt_delta: {cbsmcw: -15000, fssgl: -15000}
    action: PARTIAL_REVERSAL
    is_ok: false
    weight: 6
    note: "EPIN/PTLF have fwd+rev at full amount; CBS reversal is 150 rupees less"

  - id: d02_dom_atm_partial_rev_lt
    code: D02
    group: D
    name: "DOM ATM — Partial Reversal, Rev Amount < Purchase"
    tran_type: ATM
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 0, tlf: 0, cbsmcw: -1, fssgl: -1}
    amt_delta: {cbsmcw: -15000, fssgl: -15000}
    action: PARTIAL_REVERSAL
    is_ok: false
    weight: 5
    note: "EPIN/TLF have fwd+rev at full amount; CBS reversal is 150 rupees less"

  - id: d03_int_pos_partial_rev
    code: D03
    group: D
    name: "INT POS — Partial Reversal (FX partial credit)"
    tran_type: POS
    tran_category: I
    coverage: [exhaustive]
    file_states: {epin: 0, ptlf: 0, cbsmcw: -1, fssgl: -1}
    amt_delta: {cbsmcw: -10000, fssgl: -10000}
    action: PARTIAL_REVERSAL
    is_ok: false
    weight: 4

  - id: d04_dom_pos_over_rev
    code: D04
    group: D
    name: "DOM POS — Over-Reversal (Rev Amount > Purchase)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 0, ptlf: 0, cbsmcw: -1, fssgl: -1}
    amt_delta: {cbsmcw: 20000, fssgl: 20000}
    action: OVER_REVERSAL
    is_ok: false
    weight: 4
    note: "CBS reversal exceeds original purchase amount — bank pays more than charged"

  # ══════════════════════════════════════════════════════════════════
  # GROUP E — MULTIPLE REVERSALS
  # More than one reversal row exists against a single purchase.
  # Tests various amount-sum combinations and date spreads.
  # Outcome: MULTI_REVERSAL (exception in most cases)
  # ══════════════════════════════════════════════════════════════════

  - id: e01_dom_pos_2rev_sum_lt
    code: E01
    group: E
    name: "DOM POS — 2 Reversals in CBS, Sum < Purchase"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: -1, fssgl: -1}
    amt_delta: {cbsmcw: -35000, fssgl: -35000}
    dup_files: [cbsmcw, fssgl]
    action: MULTI_REVERSAL_SUM_LT
    is_ok: false
    weight: 5
    note: "EPIN/PTLF have 1 forward; CBS has 2 reversal rows each at (base-350 rupees). Sum of reversals is less than purchase."

  - id: e02_dom_pos_2rev_sum_eq
    code: E02
    group: E
    name: "DOM POS — 2 Reversals in CBS, Sum = Purchase (split full reversal)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: -1, fssgl: -1}
    dup_files: [cbsmcw, fssgl]
    action: MULTI_REVERSAL_SUM_EQ
    is_ok: false
    weight: 5
    note: "EPIN/PTLF 1 forward; CBS has 2 identical reversal rows — total reversals exceed single purchase"

  - id: e03_dom_pos_2rev_sum_gt
    code: E03
    group: E
    name: "DOM POS — 2 Reversals in CBS, Sum > Purchase (over-reversed)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: -1, fssgl: -1}
    amt_delta: {cbsmcw: 10000, fssgl: 10000}
    dup_files: [cbsmcw, fssgl]
    action: MULTI_REVERSAL_SUM_GT
    is_ok: false
    weight: 5
    note: "CBS has 2 reversal rows each at (base+100 rupees); sum of reversals exceeds purchase"

  - id: e04_dom_pos_2rev_diff_days
    code: E04
    group: E
    name: "DOM POS — 2 Reversals on Different Days (D and D+1)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: -1, ptlf: -1, cbsmcw: -1, fssgl: -1}
    dup_files: [cbsmcw, fssgl]
    date_delta: {cbsmcw: 1, fssgl: 1}
    action: MULTI_REVERSAL_DIFF_DAYS
    is_ok: false
    weight: 5
    note: "EPIN/PTLF: reversal on D; CBS: 2 reversal rows on D+1"

  - id: e05_dom_atm_2rev_diff_days
    code: E05
    group: E
    name: "DOM ATM — 2 Reversals on Different Days"
    tran_type: ATM
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: -1, tlf: -1, cbsmcw: -1, fssgl: -1}
    dup_files: [cbsmcw, fssgl]
    date_delta: {cbsmcw: 2, fssgl: 2}
    action: MULTI_REVERSAL_DIFF_DAYS
    is_ok: false
    weight: 4

  - id: e06_int_pos_multi_rev
    code: E06
    group: E
    name: "INT POS — Multiple Reversals Spread Over Dates"
    tran_type: POS
    tran_category: I
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: -1, fssgl: -1}
    dup_files: [cbsmcw, fssgl]
    date_delta: {cbsmcw: 3, fssgl: 3}
    action: MULTI_REVERSAL_DIFF_DAYS
    is_ok: false
    weight: 4
    note: "EPIN/PTLF have original forward; CBS has 2 reversal rows dated D+3"

  # ══════════════════════════════════════════════════════════════════
  # GROUP F — INSTALLMENT / SPLIT BILLING
  # Vendor claims the original purchase in multiple installments.
  # E.g., 1000 split into 500+500. EPIN shows full purchase amount
  # while CBS shows multiple partial-claim rows.
  # Outcome: INSTALLMENT (exception — CBS row count or amount differs)
  # ══════════════════════════════════════════════════════════════════

  - id: f01_dom_pos_inst_2_equal
    code: F01
    group: F
    name: "DOM POS — 2 Equal Installments (500+500 for 1000 purchase)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: 1, fssgl: 1}
    amt_delta: {cbsmcw: -25000, fssgl: -25000}
    dup_files: [cbsmcw, fssgl]
    action: INSTALLMENT
    is_ok: false
    weight: 5
    note: "EPIN/PTLF: 1 purchase at full amount; CBS: 2 rows each at (base-250 rupees). Models vendor claiming in two installments."

  - id: f02_dom_pos_inst_2_unequal
    code: F02
    group: F
    name: "DOM POS — 2 Unequal Installments (300+700 for 1000)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: 1, fssgl: 1}
    amt_delta: {cbsmcw: -30000, fssgl: -30000}
    dup_files: [cbsmcw, fssgl]
    action: INSTALLMENT
    is_ok: false
    weight: 5
    note: "CBS has 2 rows at (base-300 rupees) each — unequal split approximation"

  - id: f03_dom_pos_inst_3
    code: F03
    group: F
    name: "DOM POS — 3 Installments (CBS has 3 partial rows)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: 1, fssgl: 1}
    amt_delta: {cbsmcw: -33000, fssgl: -33000}
    dup_files: [cbsmcw, fssgl]
    action: INSTALLMENT
    is_ok: false
    weight: 4
    note: "3-installment scenario approximated: CBS has 2 reduced-amount rows (framework max)"

  - id: f04_int_pos_inst_diff_days
    code: F04
    group: F
    name: "INT POS — 2 Installments on Different Dates"
    tran_type: POS
    tran_category: I
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: 1, fssgl: 1}
    amt_delta: {cbsmcw: -25000, fssgl: -25000}
    dup_files: [cbsmcw, fssgl]
    date_delta: {cbsmcw: 2, fssgl: 2}
    action: INSTALLMENT
    is_ok: false
    weight: 4
    note: "EPIN/PTLF on D; CBS has 2 partial installment rows on D+2"

  - id: f05_dom_pos_inst_partial_only
    code: F05
    group: F
    name: "DOM POS — CBS Has Only First Installment (partial claim)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: 1, fssgl: 1}
    amt_delta: {cbsmcw: -50000, fssgl: -50000}
    action: INSTALLMENT_PARTIAL
    is_ok: false
    weight: 4
    note: "CBS has only the first installment (500 rupees less); second installment not yet claimed"

  - id: f06_dom_pos_inst_over_purchase
    code: F06
    group: F
    name: "DOM POS — Installments Sum > Purchase (over-billed)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 1, ptlf: 1, cbsmcw: 1, fssgl: 1}
    amt_delta: {cbsmcw: 15000, fssgl: 15000}
    dup_files: [cbsmcw, fssgl]
    action: INSTALLMENT_OVER
    is_ok: false
    weight: 4
    note: "CBS has 2 installment rows each at (base+150 rupees); total installments exceed EPIN/PTLF purchase amount"

  # ══════════════════════════════════════════════════════════════════
  # GROUP G — DISPUTES / CHARGEBACK
  # Cardholder disputes a transaction. EPIN carries the reversal
  # (chargeback filed via VISA); PTLF/TLF has the original auth;
  # CBS has both the original debit and chargeback credit.
  # Outcome: DISPUTE (exception)
  # ══════════════════════════════════════════════════════════════════

  - id: g01_dom_pos_chargeback
    code: G01
    group: G
    name: "DOM POS — Chargeback Raised (EPIN=rev, PTLF=fwd, CBS=fwd+rev)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: -1, ptlf: 1, cbsmcw: 0, fssgl: 0}
    action: DISPUTE
    is_ok: false
    weight: 6
    note: "Cardholder raises chargeback: EPIN has reversal (VISA chargeback), PTLF has original auth, CBS has both original debit + chargeback credit"

  - id: g02_int_pos_chargeback
    code: G02
    group: G
    name: "INT POS — International Chargeback"
    tran_type: POS
    tran_category: I
    coverage: [exhaustive]
    file_states: {epin: -1, ptlf: 1, cbsmcw: 0, fssgl: 0}
    action: DISPUTE
    is_ok: false
    weight: 5

  - id: g03_dom_atm_dispute
    code: G03
    group: G
    name: "DOM ATM — Disputed ATM Withdrawal"
    tran_type: ATM
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: -1, tlf: 1, cbsmcw: 0, fssgl: 0}
    action: DISPUTE
    is_ok: false
    weight: 5

  - id: g04_dom_pos_partial_chargeback
    code: G04
    group: G
    name: "DOM POS — Partial Chargeback (rev amount < original)"
    tran_type: POS
    tran_category: D
    coverage: [exhaustive]
