  # ══════════════════════════════════════════════════════════════════
  # GROUP P — MERCHANDISE CREDIT (TC 06 / TC 26) vs ORIGINAL PURCHASE
  # TC 06 = Merchandise Credit (credit issued to card).
  # TC 26 = Reversal of that merchandise credit.
  # The "original" that the MC was issued against is a prior purchase:
  #   TC 07 if it was an ATM withdrawal, TC 05 if it was a POS purchase.
  # Recon links TC06/TC26 to the original via card_pan (EPIN pos 5-20)
  # and auth_id[:6] (EPIN pos 152-157).
  # P01: original TC 05 (POS) is present in EPIN — full chain visible.
  # P02: original TC 05/07 is absent from EPIN — orphan MC exception.
  # ══════════════════════════════════════════════════════════════════

  - id: p01_dom_mc_with_original_pos
    code: P01
    group: P
    name: "DOM MC — TC06+TC26, Original TC05 (POS) Present in EPIN"
    tran_type: MERCH_CR
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 0, ptlf: 0, cbsmcw: 0, fssgl: 0}
    companion_original: POS
    action: MC_REV_ORIGINAL_PRESENT
    is_ok: true
    weight: 5
    note: >
      EPIN carries: TC05 (original POS purchase), TC06 (merchandise credit),
      TC26 (reversal of TC06).  All share card_pan and the TC06/TC26 pair
      also share auth_id[:6].  Recon can trace the full chain.
      Same logic applies for ATM: replace companion_original with ATM → TC07.

  - id: p02_dom_mc_no_original
    code: P02
    group: P
    name: "DOM MC — TC06+TC26, Original TC05/TC07 Absent from EPIN"
    tran_type: MERCH_CR
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 0, ptlf: 0, cbsmcw: 0, fssgl: 0}
    action: MC_ORIGINAL_ABSENT
    is_ok: false
    weight: 4
    note: >
      EPIN carries TC06 (merchandise credit) and TC26 (its reversal) but
      NO original TC05/TC07 purchase.  Recon cannot trace the MC back to
      the triggering purchase — orphan merchandise credit exception.
      Match keys checked: card_pan (EPIN pos 5-20), auth_id[:6] (pos 152-157).

  - id: p03_dom_mc_orig_higher
    code: P03
    group: P
    name: "DOM MC — Original TC05 Amount Higher Than TC06 (Partial Credit)"
    tran_type: MERCH_CR
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 0, ptlf: 0, cbsmcw: 0, fssgl: 0}
    companion_original: POS
    companion_amt_delta: 50000
    action: MC_AMOUNT_MISMATCH
    is_ok: false
    weight: 4
    note: >
      TC05 (original POS purchase) amount is ₹500 MORE than TC06 (merchandise
      credit).  All 5 join keys match so recon finds the pair, but amounts
      differ — partial credit issued against a higher-value purchase.
      TC05 amount = base + 50000 paise; TC06 amount = base.

  - id: p04_dom_mc_orig_lower
    code: P04
    group: P
    name: "DOM MC — Original TC05 Amount Lower Than TC06 (Over-Credit)"
    tran_type: MERCH_CR
    tran_category: D
    coverage: [exhaustive]
    file_states: {epin: 0, ptlf: 0, cbsmcw: 0, fssgl: 0}
    companion_original: POS
    companion_amt_delta: -50000
    action: MC_AMOUNT_MISMATCH
    is_ok: false
    weight: 4
    note: >
      TC05 (original POS purchase) amount is ₹500 LESS than TC06 (merchandise
      credit).  All 5 join keys match so recon finds the pair, but amounts
      differ — credit issued for more than the original purchase value.
      TC05 amount = base - 50000 paise; TC06 amount = base.
