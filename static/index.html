<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recon Test Data Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --surface2: #1c2030;
    --border: #252b3a;
    --border2: #2e3650;
    --text: #e2e8f0;
    --text2: #8892a4;
    --text3: #4a5568;
    --accent: #4f8ef7;
    --accent2: #2d5abf;
    --green: #34d399;
    --green-bg: #0a2318;
    --amber: #fbbf24;
    --amber-bg: #231a05;
    --red: #f87171;
    --red-bg: #230a0a;
    --purple: #a78bfa;
    --purple-bg: #1a1030;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }

  /* ── LAYOUT ── */
  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 0; display: flex; flex-direction: column; }
  .main { display: flex; flex-direction: column; overflow: hidden; }

  /* ── SIDEBAR ── */
  .sidebar-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
  .logo { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .logo-sub { font-size: 11px; color: var(--text3); letter-spacing: 0.03em; }

  .sidebar-section { padding: 16px 12px 8px; }
  .sidebar-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); padding: 0 8px; margin-bottom: 6px; }

  .uc-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: background 0.15s; margin-bottom: 2px; }
  .uc-item:hover { background: var(--surface2); }
  .uc-item.active { background: #1a2544; border: 1px solid #2d4078; }
  .uc-item.disabled { opacity: 0.4; cursor: default; }
  .uc-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .uc-dot.active-uc { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .uc-dot.placeholder { background: var(--text3); }
  .uc-name { font-size: 12px; line-height: 1.4; color: var(--text); flex: 1; }
  .uc-item.disabled .uc-name { color: var(--text3); }
  .uc-badge { font-size: 9px; font-family: var(--mono); padding: 2px 5px; border-radius: 3px; background: var(--surface); border: 1px solid var(--border); color: var(--text3); white-space: nowrap; }

  /* ── TOP BAR ── */
  .topbar { padding: 16px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
  .topbar-title { font-size: 15px; font-weight: 500; }
  .topbar-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .status-chip { font-size: 10px; font-family: var(--mono); padding: 3px 8px; border-radius: 4px; }
  .status-active { background: var(--green-bg); color: var(--green); border: 1px solid #1a5c3a; }
  .status-placeholder { background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }

  /* ── CONTENT ── */
  .content { flex: 1; overflow-y: auto; padding: 24px 28px; }

  /* ── PANELS ── */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; }
  .panel-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .panel-title { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text2); }
  .panel-body { padding: 18px; }

  /* ── SCENARIO TABLE ── */
  .scenario-grid { display: grid; gap: 8px; }
  .scenario-row { display: grid; grid-template-columns: 20px 1fr 80px 120px; align-items: start; gap: 12px; padding: 10px 12px; background: var(--surface2); border-radius: 6px; border: 1px solid var(--border); }
  .scenario-num { font-family: var(--mono); font-size: 10px; color: var(--text3); padding-top: 2px; }
  .scenario-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .scenario-desc { font-size: 11px; color: var(--text2); line-height: 1.4; }
  .scenario-weight { font-family: var(--mono); font-size: 11px; color: var(--accent); text-align: right; }
  .scenario-files { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .file-pill { font-size: 9px; font-family: var(--mono); padding: 2px 6px; border-radius: 3px; }
  .pill-nfs { background: #0a1e36; color: var(--accent); border: 1px solid #1a3a6a; }
  .pill-switch { background: var(--purple-bg); color: var(--purple); border: 1px solid #2d1e54; }
  .pill-cbs { background: var(--amber-bg); color: var(--amber); border: 1px solid #4a3a10; }

  /* ── FORM ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text2); }
  .form-input { background: var(--bg); border: 1px solid var(--border2); border-radius: 6px; padding: 8px 12px; color: var(--text); font-family: var(--mono); font-size: 13px; outline: none; transition: border 0.15s; }
  .form-input:focus { border-color: var(--accent); }
  .form-hint { font-size: 10px; color: var(--text3); }
  .volume-display { font-family: var(--mono); font-size: 22px; color: var(--accent); margin-bottom: 2px; }

  /* ── BUTTONS ── */
  .btn { padding: 9px 18px; border-radius: 6px; font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; display: inline-flex; align-items: center; gap: 7px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #6b9cf7; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border2); }
  .btn-outline:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
  .btn-green { background: #063d22; color: var(--green); border: 1px solid #1a5c3a; }
  .btn-green:hover { background: #0a5c30; }

  /* ── RESULTS ── */
  .result-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .result-card { background: var(--surface2); border-radius: 6px; padding: 14px 16px; border: 1px solid var(--border); }
  .result-card-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .result-card-value { font-family: var(--mono); font-size: 20px; font-weight: 500; }
  .label-nfs { color: var(--accent); }
  .label-switch { color: var(--purple); }
  .label-cbs { color: var(--amber); }

  .scenario-result-grid { display: grid; gap: 6px; }
  .scenario-result-row { display: grid; grid-template-columns: 1fr 80px 80px 80px 80px; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface2); border-radius: 4px; font-size: 12px; }
  .scenario-result-name { color: var(--text); }
  .scenario-result-count { font-family: var(--mono); font-size: 11px; text-align: right; }
  .th-row { grid-template-columns: 1fr 80px 80px 80px 80px; padding: 6px 12px; }
  .th-cell { font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); text-align: right; }
  .th-cell:first-child { text-align: left; }

  /* ── PREVIEW ── */
  .preview-tabs { display: flex; gap: 2px; margin-bottom: 12px; }
  .preview-tab { padding: 6px 14px; border-radius: 4px; font-size: 11px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); color: var(--text2); background: transparent; transition: all 0.15s; }
  .preview-tab.active { background: var(--surface2); border-color: var(--border2); color: var(--text); }
  .preview-tab:hover:not(.active) { color: var(--text); }
  .preview-code { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; overflow-x: auto; }
  .preview-code pre { font-family: var(--mono); font-size: 11px; color: var(--text2); line-height: 1.6; white-space: pre; }
  .preview-code .line-num { color: var(--text3); margin-right: 12px; user-select: none; }

  /* ── LOADING ── */
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(79,142,247,0.3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── PLACEHOLDER SCREEN ── */
  .placeholder-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 400px; text-align: center; gap: 12px; }
  .placeholder-icon { font-size: 40px; opacity: 0.2; }
  .placeholder-text { font-size: 16px; font-weight: 500; color: var(--text2); }
  .placeholder-sub { font-size: 13px; color: var(--text3); max-width: 320px; line-height: 1.6; }

  /* ── MISC ── */
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .tag { display: inline-block; font-size: 9px; font-family: var(--mono); padding: 2px 6px; border-radius: 3px; }
  .tag-network { background: #0a1e36; color: var(--accent); border: 1px solid #1a3a6a; }
  .tag-channel { background: var(--purple-bg); color: var(--purple); border: 1px solid #2d1e54; }
  .tag-role { background: var(--amber-bg); color: var(--amber); border: 1px solid #4a3a10; }
  .error-box { background: var(--red-bg); border: 1px solid #5c2020; border-radius: 6px; padding: 12px 16px; color: var(--red); font-size: 13px; margin-bottom: 16px; }
  .success-banner { background: var(--green-bg); border: 1px solid #1a5c3a; border-radius: 6px; padding: 12px 16px; color: var(--green); font-size: 13px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }

  .actions-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .mono { font-family: var(--mono); }
  .hidden { display: none; }

  /* ── IDFC / BANK-LEVEL ── */
  .coverage-tabs { display: flex; gap: 3px; margin-bottom: 0; }
  .coverage-tab { padding: 7px 16px; border-radius: 5px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); color: var(--text2); background: transparent; transition: all 0.15s; }
  .coverage-tab.active { background: #1a2544; border-color: #2d4078; color: var(--text); }
  .coverage-tab:hover:not(.active) { color: var(--text); border-color: var(--border2); }
  .pill-epin { background: #0a1e36; color: var(--accent); border: 1px solid #1a3a6a; }
  .pill-tlf  { background: var(--purple-bg); color: var(--purple); border: 1px solid #2d1e54; }
  .pill-ptlf { background: #1a1030; color: #c084fc; border: 1px solid #3d1e6e; }
  .pill-cbs2 { background: var(--amber-bg); color: var(--amber); border: 1px solid #4a3a10; }
  .pill-ep747{ background: #0f1e0f; color: var(--green); border: 1px solid #1a4a1a; }
  .sc-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .sc-table th { padding: 6px 8px; font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; border-bottom: 1px solid var(--border2); text-align: left; position: sticky; top: 0; background: var(--surface); }
  .sc-table td { padding: 5px 8px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
  .badge-atm  { font-size: 9px; padding: 2px 5px; border-radius: 3px; background: #0a1630; color: var(--accent); border: 1px solid #1a3a6a; font-family: var(--mono); }
  .badge-pos  { font-size: 9px; padding: 2px 5px; border-radius: 3px; background: var(--purple-bg); color: var(--purple); border: 1px solid #2d1e54; font-family: var(--mono); }
  .badge-mc   { font-size: 9px; padding: 2px 5px; border-radius: 3px; background: rgba(20,184,166,.1); color: #2dd4bf; border: 1px solid rgba(20,184,166,.3); font-family: var(--mono); }
  .badge-dom  { font-size: 9px; padding: 2px 5px; border-radius: 3px; background: var(--amber-bg); color: var(--amber); border: 1px solid #4a3a10; font-family: var(--mono); }
  .badge-int  { font-size: 9px; padding: 2px 5px; border-radius: 3px; background: var(--red-bg); color: var(--red); border: 1px solid #5c2020; font-family: var(--mono); }
  .idfc-file-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; }
</style>
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">SynthGen</div>
      <div class="logo-sub">Test Data Factory · v1.0</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Use Cases</div>
      <div id="uc-list"></div>
    </div>

    <div style="flex:1"></div>
    <div style="padding: 14px 20px; border-top: 1px solid var(--border);">
      <div style="font-size: 10px; color: var(--text3); line-height: 1.6;">
        <span style="color: var(--green);">●</span> Active &nbsp;
        <span style="color: var(--text3);">●</span> Phase 2+
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="topbar-title">Select a use case</div>
        <div class="topbar-sub" id="topbar-sub">Choose a reconciliation scenario from the left panel</div>
      </div>
      <div id="topbar-status"></div>
    </div>

    <div class="content" id="main-content">
      <div class="placeholder-screen">
        <div class="placeholder-icon">⚡</div>
        <div class="placeholder-text">Select a use case to begin</div>
        <div class="placeholder-sub">Choose a reconciliation scenario from the left panel to configure and generate test data files.</div>
      </div>
    </div>
  </main>

</div>

<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let allUseCases = [];
let selectedUC = null;
let lastResult = null;
let activePreviewTab = 'cbs';

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
async function init() {
  const res = await fetch('/api/use-cases');
  allUseCases = await res.json();
  renderSidebar();
}

// ─────────────────────────────────────────────
// SIDEBAR
// ─────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('uc-list');
  list.innerHTML = '';
  allUseCases.forEach(uc => {
    const isActive = uc.status === 'active';
    const el = document.createElement('div');
    el.className = 'uc-item' + (isActive ? '' : ' disabled');
    el.innerHTML = `
      <div class="uc-dot ${isActive ? 'active-uc' : 'placeholder'}"></div>
      <div class="uc-name">${uc.name}</div>
      ${uc.network ? `<span class="uc-badge">${uc.network}</span>` : ''}
    `;
    if (isActive) {
      el.onclick = () => selectUC(uc);
    }
    list.appendChild(el);
  });
}

function selectUC(uc) {
  selectedUC = uc;
  lastResult = null;

  document.querySelectorAll('.uc-item').forEach((el, i) => {
    el.classList.toggle('active', allUseCases[i]?.id === uc.id);
  });

  document.getElementById('topbar-title').textContent = uc.name;
  document.getElementById('topbar-sub').textContent = uc.description || '';
  document.getElementById('topbar-status').innerHTML =
    `<span class="status-chip status-active">● ACTIVE</span>`;

  if (uc.id === 'idfc_visa_issuer') {
    renderIDFCContent();
  } else if (uc.id === 'idfc_nfs_acquirer') {
    renderIDFCNFSContent();
  } else if (uc.id === 'idfc_mc_issuer') {
    renderIDFCMCContent();
  } else if (uc.id === 'nfs_atm_acquirer') {
    renderNFSATMContent();
  } else {
    renderMainContent();
  }
}

// ─────────────────────────────────────────────
// MAIN CONTENT
// ─────────────────────────────────────────────
function renderMainContent() {
  const uc = selectedUC;
  const mc = document.getElementById('main-content');

  // Participant file cards
  const fileCards = (uc.participant_files||[]).map(f => {
    const clsMap = {nfs:'pill-nfs',switch_tlf:'pill-switch',cbs:'pill-cbs'};
    const cls = clsMap[f.id] || 'pill-nfs';
    return `<div style="background:var(--surface2);border-radius:6px;padding:14px;border:1px solid var(--border)">
      <div style="margin-bottom:8px"><span class="tag ${cls}" style="font-size:10px">${f.id.toUpperCase()}</span></div>
      <div style="font-size:13px;font-weight:500;margin-bottom:4px">${f.name}</div>
      <div style="font-size:11px;color:var(--text2);line-height:1.5">${f.description}</div>
    </div>`;
  }).join('');

  mc.innerHTML = `
    <!-- PARTICIPANT FILES -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Participant Files</div>
        <div style="margin-left:auto;display:flex;gap:6px">
          <span class="tag tag-network">${uc.network||'NFS'}</span>
          <span class="tag tag-channel">${uc.channel||'ATM'}</span>
          <span class="tag tag-role">Bank as ${uc.bank_role||'issuer'}</span>
        </div>
      </div>
      <div class="panel-body">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${fileCards}</div>
      </div>
    </div>

    <!-- GENERATE FORM -->
    <div class="panel">
      <div class="panel-header"><div class="panel-title">Generate Test Files</div></div>
      <div class="panel-body">
        <div id="generate-error" class="error-box hidden"></div>
        <div class="form-grid" style="margin-bottom:18px">
          <div class="form-group">
            <div class="form-label">Transaction Date</div>
            <input class="form-input" type="date" id="tran-date" value="${todayStr()}">
          </div>
          <div class="form-group">
            <div class="form-label">Number of transactions</div>
            <input class="form-input" type="number" id="volume" value="500" min="70" max="50000"
              oninput="updateOkNote()">
            <div class="form-hint" id="vol-hint">Min 70 (1 per case + 6 guaranteed 1|1|1 mismatch variants).</div>
          </div>
          <div class="form-group">
            <div class="form-label">Reconciled % target</div>
            <div style="display:flex;align-items:center;gap:10px;margin-top:2px">
              <input type="range" id="ok-pct" min="0" max="100" value="99" step="1"
                style="flex:1;accent-color:var(--accent)" oninput="updateOkNote()">
              <span id="ok-pct-display" style="font-family:var(--mono);font-size:16px;color:var(--accent);min-width:42px">99%</span>
            </div>
            <div class="form-hint" id="ok-pct-note">At 500 records: ~90% achievable (48 exception cases fixed)</div>
          </div>
        </div>
        <div class="actions-row">
          <button class="btn btn-primary" id="generate-btn"
            onclick="${uc.network === 'VISA' ? 'runVisaMatrixFromUC()' : 'runMatrixFromUC()'}">
            <span>Generate Files</span>
          </button>
          <span style="font-size:11px;color:var(--text3)">3 files + manifest, all 64 cases covered</span>
        </div>
      </div>
    </div>

    <!-- VALUE LEGEND -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">${uc.network === 'VISA' ? '64-Case Reconciliation Matrix (VISA)' : '64-Case Reconciliation Matrix'}</div>
        <div style="margin-left:auto;font-size:11px;color:var(--text3)">16 OK · 48 exceptions · every case guaranteed ≥1 row</div>
      </div>
      <div class="panel-body" style="padding:12px 0">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 18px 14px">
          ${(uc.network === 'VISA'
            ? [['VISA TC','VISA POS/Cash forward (TC05/07)','VISA reversal (TC25/27)','forward + reversal in file'],
               ['Switch','auth approved/forwarded','reversal forwarded','original + rev both present'],
               ['CBS','customer debited','customer credited (refund)','debit + credit net zero']]
            : [['NFS','bank debited by NFS','NFS credits bank (reversal)','original + reversal in file'],
               ['Switch','txn approved/forwarded','reversal forwarded','original + rev both present'],
               ['CBS','customer debited','customer credited (refund)','debit + credit net zero']]
          ).map(([file,p1,m1,z1])=>`
          <div style="background:var(--surface2);border-radius:6px;padding:10px 12px;border:1px solid var(--border)">
            <div style="font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">${file}</div>
            ${[[1,p1],[-1,m1],[0,z1],[null,'no entry in file']].map(([v,desc])=>`
            <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;font-size:11px;color:var(--text2)">${valChip(v)} ${desc}</div>`).join('')}
          </div>`).join('')}
        </div>
        <div style="overflow-x:auto;max-height:350px;overflow-y:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:11px">
            <thead style="position:sticky;top:0;background:var(--surface)">
              <tr>
                <th style="padding:7px 10px;text-align:left;font-size:10px;color:var(--text3);text-transform:uppercase;border-bottom:1px solid var(--border2)">#</th>
                <th style="padding:7px 8px;text-align:center;font-size:10px;color:var(--amber);text-transform:uppercase;border-bottom:1px solid var(--border2)">${uc.network === 'VISA' ? 'VISA TC' : 'NFS'}</th>
                <th style="padding:7px 8px;text-align:center;font-size:10px;color:var(--purple);text-transform:uppercase;border-bottom:1px solid var(--border2)">Switch</th>

  updateOkNote();
}

function updateOkNote() {
  const vol = parseInt(document.getElementById('volume')?.value || 500);
  const pct = parseInt(document.getElementById('ok-pct')?.value || 99);
  // 48 non-OK cases + 6 guaranteed 1|1|1 mismatch variants = 54 fixed non-OK floor
  const maxOk = Math.round((vol - 54) / vol * 100);
  const achievable = Math.min(pct, Math.max(0, maxOk));
  if (document.getElementById('ok-pct-display'))
    document.getElementById('ok-pct-display').textContent = pct + '%';
  if (document.getElementById('ok-pct-note'))
    document.getElementById('ok-pct-note').textContent =
      `At ${vol} records: ~${achievable}% achievable (54 fixed exceptions: 48 non-OK cases + 6 mismatch 1|1|1)`;
}

async function switchPreview(fileType) {
  activePreviewTab = fileType;
  // For VISA runs, 'nfs' tab actually shows 'visa_tc'
  const isVisa = selectedUC && selectedUC.network === 'VISA';
  const resolvedType = (isVisa && fileType === 'nfs') ? 'visa_tc' : fileType;
  ['cbs', 'nfs', 'switch_tlf'].forEach(t => {
    document.getElementById(`tab-${t}`)?.classList.toggle('active', t === fileType);
  });
  const fetchType = resolvedType;

  if (!lastResult) return;
  const area = document.getElementById('preview-area');
  area.innerHTML = '<pre style="color:var(--text3)">Loading…</pre>';

  try {
    const res = await fetch(`/api/preview/${lastResult.run_id}/${fetchType}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const lines = data.preview;
    const html = lines.map((l, i) => {
      const escaped = l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return `<span class="line-num">${String(i+1).padStart(3,' ')}</span>${escaped}`;
    }).join('\n');
    area.innerHTML = `<pre>${html}</pre>
      <div style="font-size:10px;color:var(--text3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">
        Showing ${lines.length} of ${data.total_lines} rows · ${data.file}
      </div>`;
  } catch (e) {

}

async function runGenerateEJ() {
  const btn = document.getElementById('ej-generate-btn');
  const errBox = document.getElementById('ej-error');
  errBox.classList.add('hidden');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div><span>Generating…</span>';

  const atm_type        = document.getElementById('ej-atm-type').value;
  const tran_date       = document.getElementById('ej-tran-date').value;
  const num_transactions = parseInt(document.getElementById('ej-num-txns').value);
  const selected_cases  = [...ejSelectedCases];

  try {
    const res = await fetch('/api/generate-ej', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ atm_type, tran_date, num_transactions, selected_cases, bank_id: 'sbi' }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Generation failed');
    ejLastResult = data;
    renderEJResults(data);
  } catch(e) {
    errBox.textContent = '✗ ' + e.message;
    errBox.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>Generate EJ File</span>';
  }
}

      </div>

  const caseLabels = {};
  EJ_CASES.forEach(c => { caseLabels[c.id] = c.label; });
  caseLabels['sync'] = 'Sync / Normal Withdrawals';

  const allCaseIds = ['sync', 'withdrawal_success', 'balance_inquiry',
    'declined_insufficient', 'declined_unauthorized', 'host_timeout',
    'cash_not_taken', 'notes_in_reject', 'partial_ej', 'admin_cassette',
    'unknown_notes', 'deposit_card', 'deposit_cardless', 'deposit_rejected',
    'deposit_retracted', 'deposit_jam'];

  allCaseIds.forEach(id => {
    const n = counts[id] || 0;
    if (n === 0) return;
    const color = id.startsWith('deposit') ? 'var(--purple)' :
                  id.startsWith('declined') || id === 'host_timeout' ? 'var(--red)' :

                  'var(--green)';

      <div class="result-card-value" style="color:${color};font-size:18px">${n}</div>
    </div>`;
  });

  html += '</div>';
  document.getElementById('ej-result-body').innerHTML = html;
  document.getElementById('ej-results').scrollIntoView({ behavior: 'smooth' });
}

function isOkCustom(cs) {
  if (cs.cbs_fwd === null || cs.switch_fwd === null || cs.epin_fwd === null) return false;
  const cbsKey = `${cs.cbs_fwd}/${cs.cbs_rev||0}`;
  const swKey  = `${cs.switch_fwd}/${cs.switch_rev||0}`;
  const epKey  = `${cs.epin_fwd}/${cs.epin_rev||0}`;
  return cbsKey === swKey && swKey === epKey && (cs.cbs_fwd + (cs.cbs_rev||0)) > 0;
}

function stateChipFR(fwd, rev) {
  const base = 'font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid;white-space:nowrap';
  if (fwd === null)
    return `<span style="${base} var(--border);color:var(--text3);background:var(--surface2)">—</span>`;
  const f = fwd || 0, r = rev || 0;
  if (f === 0 && r === 0)
    return `<span style="${base} var(--border2);color:var(--text2);background:var(--surface2)">0</span>`;
  const parts = [];
  if (f > 0) parts.push(`+${f}F`);
  if (r > 0) parts.push(`-${r}R`);
  const label = parts.join(' ');
  if (f > 0 && r === 0)
    return `<span style="${base} #1a5c3a;color:var(--green);background:var(--green-bg)">${label}</span>`;
  if (f === 0 && r > 0)
    return `<span style="${base} #78350f;color:var(--amber);background:rgba(245,158,11,.1)">${label}</span>`;
  return `<span style="${base} #3730a3;color:#a5b4fc;background:rgba(99,102,241,.1)">${label}</span>`;
}

function toggleFileNull(prefix) {
  const btn    = document.getElementById(`cs-${prefix}-null`);
  const fwdEl  = document.getElementById(`cs-${prefix}-fwd`);
  const revEl  = document.getElementById(`cs-${prefix}-rev`);
  if (!btn) return;
  const nowNull = btn.dataset.active !== '1';
  btn.dataset.active = nowNull ? '1' : '0';
  btn.style.color       = nowNull ? 'var(--amber)' : 'var(--text3)';
  btn.style.borderColor = nowNull ? 'var(--amber)' : 'var(--border2)';
  btn.textContent = nowNull ? '∅ null' : 'null';
  [fwdEl, revEl].forEach(el => { if (el) { el.disabled = nowNull; el.style.opacity = nowNull ? '0.35' : '1'; } });
}

function _readFileState(prefix) {
  const btn = document.getElementById(`cs-${prefix}-null`);
  if (btn && btn.dataset.active === '1') return { fwd: null, rev: null };
  const fwd = Math.min(9, Math.max(0, parseInt(document.getElementById(`cs-${prefix}-fwd`)?.value || '1') || 0));
  const rev = Math.min(9, Math.max(0, parseInt(document.getElementById(`cs-${prefix}-rev`)?.value || '0') || 0));
  return { fwd, rev };
}

function addCustomScenario() {
  if (customScenarios.length >= 100) return;
  const wasEmpty = customScenarios.length === 0;
  const cbs = _readFileState('cbs');
  const sw  = _readFileState('sw');
  const ep  = _readFileState('ep');
  customScenarios.push({
    tran_type:     document.getElementById('cs-tran-type')?.value || 'ATM',
    tran_category: document.getElementById('cs-tran-cat')?.value || 'D',
    cbs_fwd: cbs.fwd, cbs_rev: cbs.rev,
    switch_fwd: sw.fwd, switch_rev: sw.rev,
    epin_fwd: ep.fwd, epin_rev: ep.rev,
  });
  if (wasEmpty) selectAllScenarios(false);
  renderCustomScenarioList();
  updateIDFCOkNote();
}

function removeCustomScenario(idx) {
  customScenarios.splice(idx, 1);
  renderCustomScenarioList();
  updateIDFCOkNote();
}

function clearAllCustomScenarios() {
  customScenarios = [];

  const listEl  = document.getElementById('custom-scenario-list');
  const countEl = document.getElementById('custom-scenario-count');
  if (!listEl) return;
  const n    = customScenarios.length;
  const okN  = customScenarios.filter(isOkCustom).length;
  if (countEl) countEl.textContent = `${n} / 100 · ${okN} OK · ${n - okN} EXC`;

  if (n === 0) {
    listEl.innerHTML = `<div style="font-size:10px;color:var(--text3);font-style:italic;padding:4px 0">No entries yet — use the controls above to add scenarios.</div>`;
    return;
  }
  let rows = '';
  customScenarios.forEach((cs, i) => {
    const ok   = isOkCustom(cs);
    const typB = cs.tran_type === 'ATM'
      ? `<span class="badge-atm">ATM</span>`
      : cs.tran_type === 'MERCH_CR' ? `<span class="badge-mc">MC</span>`
      : `<span class="badge-pos">POS</span>`;
    const diB  = cs.tran_category === 'D'
      ? `<span class="badge-dom">DOM</span>` : `<span class="badge-int">INT</span>`;
    const stB  = ok
      ? `<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid #1a5c3a">OK</span>`
      : `<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:var(--surface2);color:var(--text3);border:1px solid var(--border)">EXC</span>`;
    rows += `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:3px 6px;font-family:var(--mono);font-size:10px;color:var(--text3)">${i+1}</td>
      <td style="padding:3px 4px;text-align:center">${typB}</td>

function getScenarioStats() {
  let total = 0, sel = 0, okSel = 0, excSel = 0;
  if (idfcScenarios) {
    for (const scs of Object.values(idfcScenarios.groups || {})) {
      for (const sc of scs) {
        total++;
        if (selectedScenarioIds.has(sc.id)) {
          sel++;
          if (sc.is_ok) okSel++; else excSel++;
        }
      }
    }
  }
  // Custom entries always count as "selected"
  for (const cs of customScenarios) {
    sel++;
    if (isOkCustom(cs)) okSel++; else excSel++;
  }
  return { total, selected: sel, okSelected: okSel, excSelected: excSel };
}

function toggleScenarioSelector() {
  scenarioSelectorOpen = !scenarioSelectorOpen;
  const panel = document.getElementById('scenario-selector-panel');
  const arrow = document.getElementById('scenario-selector-arrow');
  if (panel) panel.style.display = scenarioSelectorOpen ? 'block' : 'none';
  if (arrow) arrow.textContent = scenarioSelectorOpen ? '▲ collapse' : '▼ expand';
}

function toggleCategory(grpLetter, checked) {
  if (!idfcScenarios) return;
  const scs = idfcScenarios.groups[grpLetter] || [];
  scs.forEach(sc => {
    if (checked) selectedScenarioIds.add(sc.id); else selectedScenarioIds.delete(sc.id);
    const cb = document.getElementById('sc-cb-' + sc.id);
    if (cb) cb.checked = checked;
  });
  const catCb = document.getElementById('cat-cb-' + grpLetter);
  if (catCb) catCb.indeterminate = false;
  updateScenarioSummary();
  updateIDFCOkNote();
}

function toggleSingleScenario(scId, checked) {
  if (checked) selectedScenarioIds.add(scId); else selectedScenarioIds.delete(scId);
  if (idfcScenarios) {
    for (const [grp, scs] of Object.entries(idfcScenarios.groups || {})) {
      if (scs.some(s => s.id === scId)) {
        const allChk = scs.every(s => selectedScenarioIds.has(s.id));
        const noneChk = scs.every(s => !selectedScenarioIds.has(s.id));
        const catCb = document.getElementById('cat-cb-' + grp);
        if (catCb) { catCb.checked = allChk; catCb.indeterminate = !allChk && !noneChk; }
        break;
      }
    }
  }
  updateScenarioSummary();
  updateIDFCOkNote();
}

function toggleCategoryExpand(grp) {
  const panel = document.getElementById('cat-sc-' + grp);
  const arrow = document.getElementById('cat-arr-' + grp);
  if (!panel) return;
  const vis = panel.style.display !== 'none';
  panel.style.display = vis ? 'none' : 'block';
  if (arrow) arrow.textContent = vis ? '▶' : '▼';
}

function selectAllScenarios(checked) {
  if (!idfcScenarios) return;
  for (const [grp, scs] of Object.entries(idfcScenarios.groups || {})) {
    for (const sc of scs) {
      if (checked) selectedScenarioIds.add(sc.id); else selectedScenarioIds.delete(sc.id);
      const cb = document.getElementById('sc-cb-' + sc.id);
      if (cb) cb.checked = checked;
    }
    const catCb = document.getElementById('cat-cb-' + grp);
    if (catCb) { catCb.checked = checked; catCb.indeterminate = false; }
  }
  updateScenarioSummary();
  updateIDFCOkNote();
}

function selectByType(type) {
  if (!idfcScenarios) return;
  for (const [grp, scs] of Object.entries(idfcScenarios.groups || {})) {
    for (const sc of scs) {
      const match = sc.tran_type === type;
      if (match) selectedScenarioIds.add(sc.id); else selectedScenarioIds.delete(sc.id);
      const cb = document.getElementById('sc-cb-' + sc.id);
      if (cb) cb.checked = match;
    }
    const allChk = scs.every(s => selectedScenarioIds.has(s.id));
    const noneChk = scs.every(s => !selectedScenarioIds.has(s.id));
    const catCb = document.getElementById('cat-cb-' + grp);
    if (catCb) { catCb.checked = allChk; catCb.indeterminate = !allChk && !noneChk; }
  }
  updateScenarioSummary();
  updateIDFCOkNote();
}

function updateScenarioSummary() {
  const s = getScenarioStats();
  const el = document.getElementById('scenario-selector-summary');
  if (el) {
    if (s.selected === s.total) el.textContent = `All ${s.total} scenarios`;
    else if (s.selected === 0) el.textContent = 'No scenarios selected';
    else el.textContent = `${s.selected} of ${s.total} scenarios selected`;
  }
  const badge = document.getElementById('scenario-count-badge');
  if (badge) badge.textContent = `${s.okSelected} OK · ${s.excSelected} exception`;
}

function buildScenarioSelectorHTML() {
  if (!idfcScenarios) return '<div style="color:var(--text3);padding:8px">Loading…</div>';
  const groups = idfcScenarios.groups || {};
  let html = '';
  for (const [grp, scs] of Object.entries(groups)) {
    const grpName = IDFC_GROUP_NAMES[grp] || grp;
    const grpColor = IDFC_GROUP_COLORS[grp] || 'var(--text2)';
    const okCnt = scs.filter(s => s.is_ok).length;
    const excCnt = scs.length - okCnt;
    const allSel = scs.every(s => selectedScenarioIds.has(s.id));
    const noneSel = scs.every(s => !selectedScenarioIds.has(s.id));
    html += `<div style="margin-bottom:5px;border:1px solid var(--border);border-radius:5px;overflow:hidden">
      <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface2);cursor:pointer"
           onclick="toggleCategoryExpand('${grp}')">
        <input type="checkbox" id="cat-cb-${grp}" ${allSel ? 'checked' : ''}
          onclick="event.stopPropagation();toggleCategory('${grp}', this.checked)"
          style="width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0">
        <span style="font-family:var(--mono);font-size:11px;font-weight:700;color:${grpColor};min-width:14px">${grp}</span>
        <span style="font-size:11px;font-weight:600;color:var(--text);flex:1">${grpName}</span>
        <span style="font-size:10px;color:var(--text3)">${scs.length}</span>
        ${okCnt ? `<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid #1a5c3a">${okCnt}OK</span>` : ''}
        ${excCnt ? `<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:var(--surface);color:var(--text3);border:1px solid var(--border)">${excCnt}EXC</span>` : ''}
        <span id="cat-arr-${grp}" style="font-size:9px;color:var(--text3)">▼</span>
      </div>
      <div id="cat-sc-${grp}">
        ${scs.map(sc => {
          const chk = selectedScenarioIds.has(sc.id) ? 'checked' : '';
          return `<div style="display:flex;align-items:center;gap:6px;padding:4px 10px 4px 30px;border-top:0.5px solid var(--border)">
            <input type="checkbox" id="sc-cb-${sc.id}" ${chk}
              onclick="toggleSingleScenario('${sc.id}', this.checked)"
              style="width:13px;height:13px;accent-color:var(--accent);cursor:pointer;flex-shrink:0">
            <span style="font-family:var(--mono);font-size:10px;font-weight:600;color:${grpColor};min-width:30px">${sc.code}</span>
            <span style="font-size:11px;color:var(--text);flex:1;line-height:1.3">${sc.name}</span>
            <span class="${sc.tran_type === 'ATM' ? 'badge-atm' : 'badge-pos'}" style="font-size:8px;padding:1px 3px">${sc.tran_type}</span>
            <span class="${sc.tran_category === 'D' ? 'badge-dom' : 'badge-int'}" style="font-size:8px;padding:1px 3px">${sc.tran_category === 'D' ? 'D' : 'I'}</span>
            ${sc.is_ok
              ? '<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid #1a5c3a">OK</span>'
              : '<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:var(--surface);color:var(--text3);border:1px solid var(--border)">EXC</span>'}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  return html;
}

          <div id="idfc-amount-summary" style="margin-bottom:16px"></div>
          <div id="idfc-file-list" style="margin-bottom:16px"></div>
          <div id="idfc-sc-result" style="overflow-x:auto;max-height:320px;overflow-y:auto"></div>
        </div>
      </div>
    </div>
  `;

  renderIDFCScenarioTable();
  renderCustomScenarioList();
  updateIDFCOkNote();
  updateScenarioSummary();
}

function validateGlNumbers(raw) {
  if (!raw || !raw.trim()) return { valid: true, gls: [] };
  const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
  if (parts.length === 0) return { valid: true, gls: [] };
  if (parts.length > 2) return { valid: false, gls: [], error: 'Enter at most 2 GL numbers (ATM GL, POS GL)' };
  for (const gl of parts) {
    if (!/^\d+$/.test(gl)) return { valid: false, gls: [], error: `"${gl}" — digits only, no letters or spaces` };
    if (gl.length < 8 || gl.length > 16) return { valid: false, gls: [], error: `"${gl}" must be 8–16 digits long` };
    if (/^0+$/.test(gl)) return { valid: false, gls: [], error: `"${gl}" cannot be all zeros` };
  }
  return { valid: true, gls: parts };
}

function validateIDFCGl() {
  const el = document.getElementById('idfc-gl-accounts');
  const errEl = document.getElementById('idfc-gl-error');
  if (!el || !errEl) return { valid: true, gls: [] };
  const result = validateGlNumbers(el.value);
  if (!result.valid) {
    errEl.textContent = '✗ ' + result.error;
    errEl.style.display = 'block';
    el.style.outline = '2px solid #e05252';
  } else {
    errEl.style.display = 'none';
    el.style.outline = '';
  }
  return result;
}

function validateNFSGl() {
  const el = document.getElementById('nfs-gl-accounts');
  const errEl = document.getElementById('nfs-gl-error');
  if (!el || !errEl) return { valid: true, gls: [] };
  const result = validateGlNumbers(el.value);
  if (!result.valid) {
    errEl.textContent = '✗ ' + result.error;
    errEl.style.display = 'block';
    el.style.outline = '2px solid #e05252';
  } else {
    errEl.style.display = 'none';
    el.style.outline = '';
  }
  return result;
}

function updateIDFCOkNote() {
  const vol = parseInt(document.getElementById('idfc-volume')?.value || 1000);
  const pct = parseInt(document.getElementById('idfc-ok-pct')?.value || 95);
  if (document.getElementById('idfc-ok-pct-display'))
    document.getElementById('idfc-ok-pct-display').textContent = pct + '%';
  const s = getScenarioStats();
  const noteEl = document.getElementById('idfc-ok-pct-note');
  if (!noteEl) return;

  const cOk  = customScenarios.filter(isOkCustom).length;
  const cExc = customScenarios.length - cOk;
  const regSel = s.selected - customScenarios.length;
  const regOk  = s.okSelected - cOk;
  const regExc = s.excSelected - cExc;

  if (s.selected === 0) {
    noteEl.textContent = '⚠ No scenarios selected';
  } else if (regSel === 0) {
    noteEl.textContent = `${customScenarios.length} custom entr${customScenarios.length===1?'y':'ies'} · ${cOk} OK · ${cExc} EXC`;
  } else if (regExc === 0) {
    const cNote = customScenarios.length ? ` + ${customScenarios.length} custom (${cOk} OK)` : '';
    noteEl.textContent = `100% achievable — only OK scenarios · ~${vol.toLocaleString()} groups${cNote}`;
  } else {
    const maxPct  = Math.round(regOk / regSel * 100);
    const effPct  = Math.min(pct, maxPct);
    const okEst   = Math.round(vol * effPct / 100);
    const cNote   = customScenarios.length ? ` + ${customScenarios.length} custom (${cOk} OK)` : '';
    noteEl.textContent =
      `Max ${maxPct}% · ~${okEst.toLocaleString()} OK · ~${(vol-okEst).toLocaleString()} EXC${cNote}`;
  }
}

function renderIDFCScenarioTable() {
  if (!idfcScenarios) return;
  const groups = idfcScenarios.groups || {};
  const total = idfcScenarios.total || 0;
  const tbody = document.getElementById('idfc-sc-tbody');
  const countEl = document.getElementById('idfc-sc-count');
  if (!tbody) return;

  countEl.textContent = `${total} scenarios · exhaustive`;

  const FILE_ICONS = {
    epin: ['pill-epin','EPIN'], tlf: ['pill-tlf','TLF'], ptlf: ['pill-ptlf','PTLF'],
    cbsmcw: ['pill-cbs2','CBS'], fssgl: ['pill-cbs2','GL'], ep747_dom: ['pill-ep747','EP7D'], ep747_int: ['pill-ep747','EP7I']
  };

  let html = '';
  for (const [grpLetter, scenarios] of Object.entries(groups)) {
    const grpName = IDFC_GROUP_NAMES[grpLetter] || grpLetter;
    const grpColor = IDFC_GROUP_COLORS[grpLetter] || 'var(--text2)';
    const okCount = scenarios.filter(s => s.is_ok).length;
    const excCount = scenarios.length - okCount;
    html += `<tr>
      <td colspan="7" style="background:var(--bg);padding:8px 12px;border-top:1px solid var(--border2)">
        <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:${grpColor}">${grpLetter}</span>
        <span style="font-size:11px;font-weight:600;color:var(--text);margin-left:8px">${grpName}</span>
        <span style="font-size:10px;color:var(--text3);margin-left:10px">${scenarios.length} cases</span>
        ${okCount ? `<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid #1a5c3a;margin-left:6px">${okCount} OK</span>` : ''}
        ${excCount ? `<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:var(--surface2);color:var(--text3);border:1px solid var(--border);margin-left:4px">${excCount} EXC</span>` : ''}
      </td>
    </tr>`;

    html += scenarios.map(sc => {
      const typeBadge = sc.tran_type === 'ATM'
        ? `<span class="badge-atm">ATM</span>`
        : sc.tran_type === 'MERCH_CR' ? `<span class="badge-mc">MC</span>`
        : `<span class="badge-pos">POS</span>`;
      const diFlag = sc.tran_category === 'D'
        ? `<span class="badge-dom">DOM</span>`
        : `<span class="badge-int">INT</span>`;
      const fs = sc.file_states || {};
      const filePills = Object.entries(fs).map(([k, v]) => {
        const [cls, lbl] = FILE_ICONS[k] || ['pill-nfs', k];
        const sym = v === 1 ? '+' : v === -1 ? '−' : v === 0 ? '±' : '';
        return `<span class="file-pill ${cls}" style="font-size:8px">${lbl}${sym}</span>`;
      }).join('');
      const okBadge = sc.is_ok
        ? `<span style="font-size:9px;padding:2px 5px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid #1a5c3a">OK</span>`
        : `<span style="font-size:9px;padding:2px 5px;border-radius:3px;background:var(--surface2);color:var(--text3);border:1px solid var(--border)">EXC</span>`;
      return `<tr>
        <td style="font-family:var(--mono);font-size:10px;font-weight:600;color:${grpColor}">${sc.code}</td>
        <td style="max-width:240px;font-size:11px;color:var(--text)">${sc.name}</td>
        <td>${typeBadge}</td>
        <td>${diFlag}</td>
        <td style="display:flex;flex-wrap:wrap;gap:2px;min-width:120px">${filePills || '<span style="color:var(--text3);font-size:10px">—</span>'}</td>
        <td style="font-size:10px;color:var(--text2)">${sc.action || ''}</td>
        <td>${okBadge}</td>
      </tr>`;
    }).join('');
  }
  tbody.innerHTML = html;
}

async function runIDFCGenerate() {
  const s = getScenarioStats();
  const errBox = document.getElementById('idfc-error');
  errBox.classList.add('hidden');
  if (s.selected === 0) {
    errBox.textContent = '✗ No scenarios selected. Select from the list below or add custom entries above.';
    errBox.classList.remove('hidden');
    return;
  }
  const glResult = validateIDFCGl();
  if (!glResult.valid) {
    errBox.textContent = '✗ GL Account: ' + glResult.error;
    errBox.classList.remove('hidden');
    return;
  }
  const btn = document.getElementById('idfc-generate-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div><span>Generating…</span>';

  const volume = parseInt(document.getElementById('idfc-volume').value);
  const tranDate = document.getElementById('idfc-tran-date').value;
  const okPct = parseFloat(document.getElementById('idfc-ok-pct')?.value || 95);
  const bankId = document.getElementById('idfc-bank-select')?.value || 'idfc';
  const scenarioIds = Array.from(selectedScenarioIds);
  const numDays = Math.max(1, Math.min(5, parseInt(document.getElementById('idfc-num-days')?.value || 1)));
  const lateNetworkMismatches = ['none', 'lower', 'higher'].filter(v => document.getElementById(`idfc-late-${v}`)?.checked);
  const latePayload = lateNetworkMismatches.length ? lateNetworkMismatches : ['none'];

  try {
    const res = await fetch('/api/generate-idfc-visa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ volume, tran_date: tranDate, bank_id: bankId, ok_pct: okPct, selected_scenarios: scenarioIds, custom_scenarios: customScenarios, gl_accounts: glResult.gls, no_cbsmcw_duplicates: document.getElementById('idfc-no-dup-cbsmcw')?.checked !== false, num_days: numDays, late_network_mismatches: latePayload }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Generation failed');
    idfcLastResult = data;
    renderIDFCResults(data);
  } catch(e) {
    errBox.textContent = '✗ ' + e.message;
    errBox.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>Generate</span>';
  }
}

function renderIDFCResults(data) {
  document.getElementById('idfc-results-section').classList.remove('hidden');
  const counts = data.counts || {};
  const rs = data.recon_summary || {};
  const segs = rs.segments || {};
  const excBreak = rs.exception_breakdown || {};
  const actualPct = rs.ok_pct || 0;

  document.getElementById('idfc-success-text').textContent =
    `✓ ${counts.total_groups || 0} groups — ${actualPct}% reconciled (${rs.ok_count||0} OK · ${rs.exception_count||0} exceptions)`;

  document.getElementById('idfc-result-counts').innerHTML = `

    <div class="result-card"><div class="result-card-label" style="color:var(--green)">Reconciled</div><div class="result-card-value" style="color:var(--green)">${rs.ok_count||0}</div></div>
    <div class="result-card"><div class="result-card-label" style="color:var(--red)">Exceptions</div><div class="result-card-value" style="color:var(--red)">${rs.exception_count||0}</div></div>

  `;

  // ── Amount Summary Panel ──────────────────────────────────────────────────
  const amtSum = data.amount_summary || {};
  const amtFwd = amtSum.forward || {};
  const amtRev = amtSum.reversal || {};
  const amtTF  = amtSum.total_forward  || {count:0, amount_rs:0};
  const amtTR  = amtSum.total_reversal || {count:0, amount_rs:0};

  function fmtINR(v) {
    if (!v) return '—';
    if (v >= 10000000) return '₹' + (v/10000000).toFixed(2) + ' Cr';
    if (v >= 100000)   return '₹' + (v/100000).toFixed(2) + ' L';
    if (v >= 1000)     return '₹' + (v/1000).toFixed(1) + 'K';
    return '₹' + v.toFixed(0);
  }
  function amtCell(k, bucket) {
    const d = bucket[k] || {count:0, amount_rs:0};
    if (!d.count) return `<td style="text-align:right;color:var(--text3);font-size:10px">—</td>`;
    return `<td style="text-align:right">
      <div style="font-family:var(--mono);font-size:11px;font-weight:600">${fmtINR(d.amount_rs)}</div>
      <div style="font-size:9px;color:var(--text3)">${d.count} txns</div>
    </td>`;
  }
  function totalCell(d, color) {
    if (!d.count) return `<td style="text-align:right;color:var(--text3);font-size:10px">—</td>`;
    return `<td style="text-align:right;background:var(--bg);border-left:2px solid var(--border2)">
      <div style="font-family:var(--mono);font-size:12px;font-weight:700;color:${color}">${fmtINR(d.amount_rs)}</div>
      <div style="font-size:9px;color:var(--text3)">${d.count} txns</div>
    </td>`;
  }
  const AMT_COLS = ['dom_atm','dom_pos','dom_mc','int_atm','int_pos','int_mc'];
  const AMT_COL_LABELS = {'dom_atm':'DOM ATM','dom_pos':'DOM POS','dom_mc':'DOM MC','int_atm':'INT ATM','int_pos':'INT POS','int_mc':'INT MC'};
  const AMT_COL_COLORS = {'dom_atm':'var(--accent)','dom_pos':'var(--purple)','dom_mc':'var(--green)','int_atm':'var(--red)','int_pos':'var(--amber)','int_mc':'#818cf8'};
  const netAmt = amtSum.net_amount_rs || 0;
  document.getElementById('idfc-amount-summary').innerHTML = `
    <div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Transaction Amount Summary</div>
    <div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:11px">
      <thead>
        <tr style="background:var(--bg)">
          <th style="text-align:left;padding:6px 10px;color:var(--text3);font-size:10px;font-weight:600;border-bottom:1px solid var(--border2)"></th>
          ${AMT_COLS.map(k => `<th style="text-align:right;padding:6px 8px;color:${AMT_COL_COLORS[k]};font-size:10px;font-weight:600;border-bottom:1px solid var(--border2)">${AMT_COL_LABELS[k]}</th>`).join('')}
          <th style="text-align:right;padding:6px 10px;color:var(--text2);font-size:10px;font-weight:600;border-bottom:1px solid var(--border2);border-left:2px solid var(--border2)">TOTAL</th>
        </tr>
      </thead>
      <tbody>
        <tr style="background:var(--surface2)">
          <td style="padding:6px 10px;font-size:10px;font-weight:600;color:var(--text2);white-space:nowrap">Forward</td>
          ${AMT_COLS.map(k => amtCell(k, amtFwd)).join('')}
          ${totalCell(amtTF, 'var(--text)')}
        </tr>
        <tr>
          <td style="padding:6px 10px;font-size:10px;font-weight:600;color:var(--amber);white-space:nowrap">Reversal</td>
          ${AMT_COLS.map(k => amtCell(k, amtRev)).join('')}
          ${totalCell(amtTR, 'var(--amber)')}
        </tr>
        <tr style="background:var(--bg);border-top:1px solid var(--border2)">
          <td style="padding:6px 10px;font-size:10px;font-weight:600;color:var(--text3);white-space:nowrap">Net (Fwd − Rev)</td>
          ${AMT_COLS.map(k => {
            const fv = (amtFwd[k]||{}).amount_rs||0;
            const rv = (amtRev[k]||{}).amount_rs||0;
            const net = fv - rv;
            if (!fv && !rv) return `<td style="text-align:right;color:var(--text3);font-size:10px">—</td>`;
            const col = net >= 0 ? 'var(--text2)' : 'var(--red)';
            return `<td style="text-align:right"><span style="font-family:var(--mono);font-size:10px;color:${col}">${fmtINR(Math.abs(net))}${net<0?' CR':''}</span></td>`;
          }).join('')}

            <span style="font-family:var(--mono);font-size:11px;font-weight:700;color:${netAmt>=0?'var(--green)':'var(--red)'}">${fmtINR(Math.abs(netAmt))}${netAmt<0?' CR':''}</span>
          </td>

      </tbody>
    </table>
    </div>`;

  // ── Reconciliation Summary Panel ──────────────────────────────────────────
  const SEG_LABELS = { dom_atm: 'DOM ATM', int_atm: 'INT ATM', dom_pos: 'DOM POS', int_pos: 'INT POS' };
  const SEG_COLORS = { dom_atm: 'var(--accent)', int_atm: 'var(--red)', dom_pos: 'var(--purple)', int_pos: 'var(--amber)' };

  const segCards = Object.entries(SEG_LABELS).map(([key, label]) => {
    const s = segs[key] || { ok: 0, total: 0, exception: 0, ok_pct: 0 };
    const pct = s.ok_pct || 0;
    const barW = Math.round(pct);
    const col = SEG_COLORS[key];
    return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:12px 14px">

      <div style="font-family:var(--mono);font-size:20px;font-weight:600;margin-bottom:2px">${pct}%</div>
      <div style="height:4px;background:var(--border);border-radius:2px;margin-bottom:8px">
        <div style="height:4px;background:${col};border-radius:2px;width:${barW}%"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3)">
        <span><span style="color:var(--green)">${s.ok}</span> OK</span>
        <span><span style="color:var(--red)">${s.exception}</span> exc</span>
        <span>${s.total} total</span>
      </div>
    </div>`;
  }).join('');

  const EXC_COLORS = {
    AMOUNT_MISMATCH: 'var(--amber)', DATE_MISMATCH: 'var(--purple)', DUPLICATE: 'var(--red)',
    DOUBLE_DEBIT: '#f97316', MISSING_FILE: 'var(--text2)', CROSSFIRE: '#818cf8', OTHER: 'var(--text3)',
  };
  const totalExc = Object.values(excBreak).reduce((a, b) => a + b, 0) || 1;
  const excBars = Object.entries(excBreak).map(([cat, cnt]) => {
    const pct = Math.round(cnt / totalExc * 100);
    const col = EXC_COLORS[cat] || 'var(--text3)';
    return `<div style="margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px">

  document.getElementById('idfc-recon-summary').innerHTML = `

    </div>`;

  const files = data.files || {};
  const errors = data.errors || {};
  const fileHtml = IDFC_FILE_DEFS.map(fd => {
    const fname = files[fd.id];
    const err = errors[fd.id];
    if (err) return `<div style="background:var(--red-bg);border:1px solid #5c2020;border-radius:5px;padding:6px 10px;font-size:10px">
      <span class="file-pill ${fd.cls}" style="font-size:8px">${fd.label}</span>
      <span style="color:var(--red);margin-left:6px">✗ ${err}</span>
    </div>`;
    return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:6px 10px;font-size:10px;display:flex;align-items:center;gap:8px">
      <span class="file-pill ${fd.cls}" style="font-size:8px">${fd.label}</span>
      <span style="color:var(--text2);font-family:var(--mono);font-size:10px;flex:1">${fname || '—'}</span>
      ${fname ? `<span style="color:var(--green);font-size:10px">✓</span>` : ''}
    </div>`;
  }).join('');
  document.getElementById('idfc-file-list').innerHTML = `
    <div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Generated Files</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${fileHtml}</div>`;

  const scenarios = data.scenarios || [];
  // Group result scenarios by group letter for display
  const resultByGroup = {};
  scenarios.forEach(sc => {
    const g = sc.group || '?';
    if (!resultByGroup[g]) resultByGroup[g] = [];
    resultByGroup[g].push(sc);
  });
  let scHtml = `<div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Scenario Breakdown</div>
    <table class="sc-table"><thead><tr>
      <th>Code</th><th>Scenario</th><th>Type</th><th>D/I</th><th>Action</th><th style="text-align:right">Groups</th><th></th>
    </tr></thead><tbody>`;
  for (const [grp, scs] of Object.entries(resultByGroup)) {
    const grpColor = IDFC_GROUP_COLORS[grp] || 'var(--text2)';
    const grpName = IDFC_GROUP_NAMES[grp] || grp;
    scHtml += `<tr><td colspan="7" style="background:var(--bg);padding:5px 10px;border-top:1px solid var(--border2)">
      <span style="font-family:var(--mono);font-size:10px;font-weight:600;color:${grpColor}">${grp}</span>
      <span style="font-size:10px;color:var(--text2);margin-left:6px">${grpName}</span>
    </td></tr>`;
    scs.forEach(sc => {
      const okBadge = sc.is_ok
        ? `<span style="font-size:9px;padding:1px 4px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid #1a5c3a">OK</span>`
        : `<span style="font-size:9px;padding:1px 4px;border-radius:3px;background:var(--surface2);color:var(--text3);border:1px solid var(--border)">EXC</span>`;
      scHtml += `<tr>
        <td style="font-family:var(--mono);font-size:10px;font-weight:600;color:${grpColor}">${sc.code||''}</td>
        <td style="font-size:11px;color:var(--text)">${sc.name}</td>
        <td>${sc.tran_type === 'ATM' ? '<span class="badge-atm">ATM</span>' : '<span class="badge-pos">POS</span>'}</td>
        <td>${sc.tran_category === 'D' ? '<span class="badge-dom">DOM</span>' : '<span class="badge-int">INT</span>'}</td>
        <td style="font-size:10px;color:var(--text2)">${sc.action||''}</td>
        <td style="text-align:right;font-family:var(--mono)">${sc.count}</td>
        <td style="text-align:right">${okBadge}</td>
      </tr>`;
    });
  }
  scHtml += '</tbody></table>';
  document.getElementById('idfc-sc-result').innerHTML = scHtml;

  document.getElementById('idfc-results-section').scrollIntoView({ behavior: 'smooth' });
}

// ─────────────────────────────────────────────
let nfsScenarios = null;
let nfsLastResult = null;
let nfsSelectedIds = new Set();
let nfsSelectorOpen = false;
let nfsCustomScenarios = [];

const NFS_FILE_DEFS = [
  { id: 'nfs',    label: 'NFS',    cls: 'pill-nfs',  desc: 'NFS Interchange (407-char)' },
  { id: 'tlf',    label: 'TLF',    cls: 'pill-tlf',  desc: 'ATM Switch Log' },
  { id: 'cbsmcw', label: 'CBSMCW', cls: 'pill-cbs2', desc: 'CBS Card File (OWDR/OWCR)' },
  { id: 'fssgl',  label: 'FSSGL',  cls: 'pill-cbs2', desc: 'CBS GL File' },
  { id: 'bgl',    label: 'BGL',    cls: 'pill-ep747', desc: 'Balance GL Report' },
];

const NFS_ACQ_BANKS = [
  { id: 'idfc', name: 'IDFC FIRST Bank' },
];

const NFS_GROUP_NAMES = {
  A: 'Perfect Match', B: 'Single Full Reversal Same Day', C: 'Reversal on Different Day',
  D: 'Partial Reversal', E: 'Multiple Reversals',
  G: 'Disputes / Chargeback', H: 'Fee Transactions', I: 'Amount Mismatches',
  J: 'Date Mismatches', K: 'Duplicates & Double Debit', L: 'Missing Files',
  M: 'Crossfire / Direction Mismatch', N: 'PNC Matrix Filler', CUSTOM: 'Custom Entries',
};

function initNFSSelectedScenarios() {
  if (!nfsScenarios) return;
  nfsSelectedIds.clear();
  for (const scs of Object.values(nfsScenarios.groups || {}))
    for (const sc of scs) nfsSelectedIds.add(sc.id);
}

function isOkNFSCustom(cs) {
  if (cs.cbs_fwd === null || cs.switch_fwd === null || cs.nfs_fwd === null) return false;
  const cbsKey = `${cs.cbs_fwd}/${cs.cbs_rev||0}`;
  const swKey  = `${cs.switch_fwd}/${cs.switch_rev||0}`;
  const nfsKey = `${cs.nfs_fwd}/${cs.nfs_rev||0}`;
  return cbsKey === swKey && swKey === nfsKey && (cs.cbs_fwd + (cs.cbs_rev||0)) > 0;
}

function getNFSScenarioStats() {
  let total = 0, sel = 0, okSel = 0, excSel = 0;
  if (nfsScenarios) {
    for (const scs of Object.values(nfsScenarios.groups || {})) {
      for (const sc of scs) {
        total++;
        if (nfsSelectedIds.has(sc.id)) {
          sel++;
          if (sc.is_ok) okSel++; else excSel++;
        }
      }
    }
  }
  for (const cs of nfsCustomScenarios) {
    sel++;
    if (isOkNFSCustom(cs)) okSel++; else excSel++;
  }
  return { total, selected: sel, okSelected: okSel, excSelected: excSel };
}

function updateNFSOkNote() {
  const vol = parseInt(document.getElementById('nfs-volume')?.value || 1000);
  const pct = parseInt(document.getElementById('nfs-ok-pct')?.value || 95);
  if (document.getElementById('nfs-ok-pct-display'))
    document.getElementById('nfs-ok-pct-display').textContent = pct + '%';
  const noteEl = document.getElementById('nfs-ok-pct-note');
  if (noteEl) noteEl.textContent = `~${Math.round(vol * pct / 100)} OK · ~${Math.round(vol * (100-pct) / 100)} exceptions at this volume`;
}

function toggleNFSCategory(grpLetter, checked) {
  if (!nfsScenarios) return;
  const scs = nfsScenarios.groups[grpLetter] || [];
  scs.forEach(sc => {
    if (checked) nfsSelectedIds.add(sc.id); else nfsSelectedIds.delete(sc.id);
    const cb = document.getElementById('nfs-sc-cb-' + sc.id);
    if (cb) cb.checked = checked;
  });
  const catCb = document.getElementById('nfs-cat-cb-' + grpLetter);
  if (catCb) catCb.indeterminate = false;
  updateNFSScenarioSummary();
  updateNFSOkNote();
}

function toggleNFSSingle(scId, checked) {
  if (checked) nfsSelectedIds.add(scId); else nfsSelectedIds.delete(scId);
  if (nfsScenarios) {
    for (const [grp, scs] of Object.entries(nfsScenarios.groups || {})) {
      if (scs.some(s => s.id === scId)) {
        const allChk  = scs.every(s => nfsSelectedIds.has(s.id));
        const noneChk = scs.every(s => !nfsSelectedIds.has(s.id));
        const catCb   = document.getElementById('nfs-cat-cb-' + grp);
        if (catCb) { catCb.checked = allChk; catCb.indeterminate = !allChk && !noneChk; }
        break;
      }
    }
  }
  updateNFSScenarioSummary();
  updateNFSOkNote();
}

function toggleNFSCategoryExpand(grp) {
  const panel = document.getElementById('nfs-cat-sc-' + grp);
  const arrow = document.getElementById('nfs-cat-arr-' + grp);
  if (!panel) return;
  const vis = panel.style.display !== 'none';
  panel.style.display = vis ? 'none' : 'block';
  if (arrow) arrow.textContent = vis ? '▶' : '▼';
}

function selectAllNFSScenarios(checked) {
  if (!nfsScenarios) return;
  for (const [grp, scs] of Object.entries(nfsScenarios.groups || {})) {
    for (const sc of scs) {
      if (checked) nfsSelectedIds.add(sc.id); else nfsSelectedIds.delete(sc.id);
      const cb = document.getElementById('nfs-sc-cb-' + sc.id);
      if (cb) cb.checked = checked;
    }
    const catCb = document.getElementById('nfs-cat-cb-' + grp);
    if (catCb) { catCb.checked = checked; catCb.indeterminate = false; }
  }
  updateNFSScenarioSummary();
  updateNFSOkNote();
}

function updateNFSScenarioSummary() {
  const s = getNFSScenarioStats();
  const el = document.getElementById('nfs-scenario-summary');
  if (el) {
    if (s.selected === s.total) el.textContent = `All ${s.total} scenarios`;
    else if (s.selected === 0) el.textContent = 'No scenarios selected';
    else el.textContent = `${s.selected} of ${s.total} scenarios selected`;
  }
  const badge = document.getElementById('nfs-sc-count-badge');
  if (badge) badge.textContent = `${s.okSelected} OK · ${s.excSelected} exception`;
}

function _readNFSFileState(prefix) {
  const btn = document.getElementById(`ncs-${prefix}-null`);
  if (btn && btn.dataset.active === '1') return { fwd: null, rev: null };
  const fwd = Math.min(9, Math.max(0, parseInt(document.getElementById(`ncs-${prefix}-fwd`)?.value || '1') || 0));
  const rev = Math.min(9, Math.max(0, parseInt(document.getElementById(`ncs-${prefix}-rev`)?.value || '0') || 0));
  return { fwd, rev };
}

function toggleNFSFileNull(prefix) {
  const btn   = document.getElementById(`ncs-${prefix}-null`);
  const fwdEl = document.getElementById(`ncs-${prefix}-fwd`);
  const revEl = document.getElementById(`ncs-${prefix}-rev`);
  if (!btn) return;
  const nowNull = btn.dataset.active !== '1';
  btn.dataset.active = nowNull ? '1' : '0';
  btn.style.color       = nowNull ? 'var(--amber)' : 'var(--text3)';
  btn.style.borderColor = nowNull ? 'var(--amber)' : 'var(--border2)';
  btn.textContent = nowNull ? '∅ null' : 'null';
  [fwdEl, revEl].forEach(el => { if (el) { el.disabled = nowNull; el.style.opacity = nowNull ? '0.35' : '1'; } });
}

function addNFSCustomScenario() {
  if (nfsCustomScenarios.length >= 100) return;
  const wasEmpty = nfsCustomScenarios.length === 0;
  const cbs = _readNFSFileState('cbs');
  const sw  = _readNFSFileState('sw');
  const nfs = _readNFSFileState('nfs');
  nfsCustomScenarios.push({
    cbs_fwd: cbs.fwd, cbs_rev: cbs.rev,
    switch_fwd: sw.fwd, switch_rev: sw.rev,
    nfs_fwd: nfs.fwd, nfs_rev: nfs.rev,
  });
  if (wasEmpty) selectAllNFSScenarios(false);
  renderNFSCustomList();
  updateNFSOkNote();
}

function removeNFSCustomScenario(idx) {
  nfsCustomScenarios.splice(idx, 1);
  renderNFSCustomList();
  updateNFSOkNote();
}

function clearAllNFSCustomScenarios() {
  nfsCustomScenarios = [];
  renderNFSCustomList();
  updateNFSOkNote();
}

function renderNFSCustomList() {
  const listEl  = document.getElementById('nfs-custom-list');
  const countEl = document.getElementById('nfs-custom-count');
  if (!listEl) return;
  const n   = nfsCustomScenarios.length;
  const okN = nfsCustomScenarios.filter(isOkNFSCustom).length;
  if (countEl) countEl.textContent = `${n} / 100 · ${okN} OK · ${n - okN} EXC`;
  if (n === 0) {
    listEl.innerHTML = `<div style="font-size:10px;color:var(--text3);font-style:italic;padding:4px 0">No entries yet — use the controls above to add scenarios.</div>`;
    return;
  }
  let rows = '';
  nfsCustomScenarios.forEach((cs, i) => {
    const ok  = isOkNFSCustom(cs);
    const stB = ok
      ? `<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid #1a5c3a">OK</span>`
      : `<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:var(--surface2);color:var(--text3);border:1px solid var(--border)">EXC</span>`;
    rows += `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:3px 6px;font-family:var(--mono);font-size:10px;color:var(--text3)">${i+1}</td>
      <td style="padding:3px 6px;text-align:center">${stateChipFR(cs.cbs_fwd, cs.cbs_rev)}</td>
      <td style="padding:3px 6px;text-align:center">${stateChipFR(cs.switch_fwd, cs.switch_rev)}</td>
      <td style="padding:3px 6px;text-align:center">${stateChipFR(cs.nfs_fwd, cs.nfs_rev)}</td>
      <td style="padding:3px 6px;text-align:center">${stB}</td>
      <td style="padding:3px 6px;text-align:right"><button onclick="removeNFSCustomScenario(${i})" style="font-size:11px;padding:0 6px;border-radius:3px;border:1px solid var(--border2);background:transparent;color:var(--red);cursor:pointer;line-height:18px">×</button></td>
    </tr>`;
  });
  listEl.innerHTML = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">
    <thead><tr style="background:var(--bg)">
      <th style="text-align:left;padding:3px 6px;font-size:9px;color:var(--text3);border-bottom:1px solid var(--border2)">#</th>
      <th style="padding:3px 6px;font-size:9px;color:var(--text3);border-bottom:1px solid var(--border2)">CBS/FSS</th>
      <th style="padding:3px 6px;font-size:9px;color:var(--text3);border-bottom:1px solid var(--border2)">TLF</th>
      <th style="padding:3px 6px;font-size:9px;color:var(--text3);border-bottom:1px solid var(--border2)">NFS</th>
      <th style="padding:3px 6px;font-size:9px;color:var(--text3);border-bottom:1px solid var(--border2)">Status</th>
      <th style="border-bottom:1px solid var(--border2)"></th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function buildNFSSelectorHTML() {
  if (!nfsScenarios) return '<div style="color:var(--text3);padding:8px">Loading…</div>';
  const groups = nfsScenarios.groups || {};
  let html = '';
  for (const [grp, scs] of Object.entries(groups)) {
    const grpName  = NFS_GROUP_NAMES[grp] || grp;
    const grpColor = IDFC_GROUP_COLORS[grp] || 'var(--text2)';
    const okCnt    = scs.filter(s => s.is_ok).length;
    const excCnt   = scs.length - okCnt;
    const allSel   = scs.every(s => nfsSelectedIds.has(s.id));
    html += `<div style="margin-bottom:5px;border:1px solid var(--border);border-radius:5px;overflow:hidden">
      <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface2);cursor:pointer"
           onclick="toggleNFSCategoryExpand('${grp}')">
        <input type="checkbox" id="nfs-cat-cb-${grp}" ${allSel ? 'checked' : ''}
          onclick="event.stopPropagation();toggleNFSCategory('${grp}', this.checked)"
          style="width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0">
        <span style="font-family:var(--mono);font-size:11px;font-weight:700;color:${grpColor};min-width:14px">${grp}</span>
        <span style="font-size:11px;font-weight:600;color:var(--text);flex:1">${grpName}</span>
        <span style="font-size:10px;color:var(--text3)">${scs.length}</span>
        ${okCnt  ? `<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid #1a5c3a">${okCnt}OK</span>` : ''}
        ${excCnt ? `<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:var(--surface);color:var(--text3);border:1px solid var(--border)">${excCnt}EXC</span>` : ''}
        <span id="nfs-cat-arr-${grp}" style="font-size:9px;color:var(--text3)">▼</span>
      </div>
      <div id="nfs-cat-sc-${grp}">
        ${scs.map(sc => {
          const chk = nfsSelectedIds.has(sc.id) ? 'checked' : '';
          return `<div style="display:flex;align-items:center;gap:6px;padding:4px 10px 4px 30px;border-top:0.5px solid var(--border)">
            <input type="checkbox" id="nfs-sc-cb-${sc.id}" ${chk}
              onclick="toggleNFSSingle('${sc.id}', this.checked)"
              style="width:13px;height:13px;accent-color:var(--accent);cursor:pointer;flex-shrink:0">
            <span style="font-family:var(--mono);font-size:10px;font-weight:600;color:${grpColor};min-width:30px">${sc.code}</span>
            <span style="font-size:11px;color:var(--text);flex:1;line-height:1.3">${sc.name}</span>
            ${sc.is_ok
              ? '<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid #1a5c3a">OK</span>'
              : '<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:var(--surface);color:var(--text3);border:1px solid var(--border)">EXC</span>'}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  return html;
}

function renderNFSScenarioTable() {
  if (!nfsScenarios) return;
  const tbody = document.getElementById('nfs-sc-tbody');
  const countEl = document.getElementById('nfs-sc-count');
  if (!tbody) return;

  const groups = nfsScenarios.groups || {};
  let html = '';
  let total = 0;
  for (const [grp, scs] of Object.entries(groups)) {
    const grpColor = IDFC_GROUP_COLORS[grp] || 'var(--text2)';
    const grpName  = NFS_GROUP_NAMES[grp] || grp;
    html += `<tr><td colspan="5" style="background:var(--bg);padding:5px 10px;border-top:1px solid var(--border2)">
      <span style="font-family:var(--mono);font-size:10px;font-weight:600;color:${grpColor}">${grp}</span>
      <span style="font-size:10px;color:var(--text2);margin-left:6px">${grpName}</span>
    </td></tr>`;
    for (const sc of scs) {
      total++;
      const fs = sc.file_states || {};
      const pills = Object.keys(fs).map(k => {
        const cls = k === 'nfs' ? 'pill-nfs' : k === 'tlf' ? 'pill-tlf' : 'pill-cbs2';
        return `<span class="file-pill ${cls}" style="font-size:8px">${k.toUpperCase()}</span>`;
      }).join(' ');
      const okBadge = sc.is_ok
        ? `<span style="font-size:9px;padding:1px 4px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid #1a5c3a">OK</span>`
        : `<span style="font-size:9px;padding:1px 4px;border-radius:3px;background:var(--surface2);color:var(--text3);border:1px solid var(--border)">EXC</span>`;
      html += `<tr>
        <td style="font-family:var(--mono);font-size:10px;font-weight:600;color:${grpColor}">${sc.code}</td>
        <td style="font-size:11px">${sc.name}</td>
        <td>${pills}</td>
        <td style="font-size:10px;color:var(--text2)">${sc.action||''}</td>
        <td>${okBadge}</td>
      </tr>`;
    }
  }
  tbody.innerHTML = html;
  if (countEl) countEl.textContent = `${total} scenarios`;
}

async function runIDFCNFSGenerate() {
  const s = getNFSScenarioStats();
  const errBox = document.getElementById('nfs-error');
  errBox.classList.add('hidden');
  if (s.selected === 0) {
    errBox.textContent = '✗ No scenarios selected.';
    errBox.classList.remove('hidden');
    return;
  }
  const glResult = validateNFSGl();
  if (!glResult.valid) {
    errBox.textContent = '✗ GL Account: ' + glResult.error;
    errBox.classList.remove('hidden');
    return;
  }
  const btn = document.getElementById('nfs-generate-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div><span>Generating…</span>';

  const volume    = parseInt(document.getElementById('nfs-volume').value);
  const tranDate  = document.getElementById('nfs-tran-date').value;
  const okPct     = parseFloat(document.getElementById('nfs-ok-pct')?.value || 95);
  const bankId    = document.getElementById('nfs-bank-select')?.value || 'idfc';
  const scenIds   = Array.from(nfsSelectedIds);

  try {
    const res = await fetch('/api/generate-idfc-nfs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        volume, tran_date: tranDate, bank_id: bankId, ok_pct: okPct,
        selected_scenarios: scenIds, custom_scenarios: nfsCustomScenarios,
        gl_accounts: glResult.gls,
      }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Generation failed');
    nfsLastResult = data;
    renderIDFCNFSResults(data);
  } catch(e) {
    errBox.textContent = '✗ ' + e.message;
    errBox.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>Generate</span>';
  }
}

function renderIDFCNFSResults(data) {
  document.getElementById('nfs-results-section').classList.remove('hidden');
  const counts = data.counts || {};
  const rs     = data.recon_summary || {};
  const excBrk = rs.exception_breakdown || {};
  const pct    = rs.ok_pct || 0;

  document.getElementById('nfs-success-text').textContent =
    `✓ ${counts.total_groups||0} groups — ${pct}% reconciled (${rs.ok_count||0} OK · ${rs.exception_count||0} exceptions)`;

  document.getElementById('nfs-download-btn').onclick = () =>
    window.location.href = `/api/download-idfc-nfs/${data.run_id}`;

  document.getElementById('nfs-result-counts').innerHTML = `
    <div class="result-card"><div class="result-card-label" style="color:var(--green)">Total Groups</div><div class="result-card-value" style="color:var(--green)">${counts.total_groups||0}</div><div style="font-size:10px;color:var(--text3);margin-top:4px">${pct}% reconciled</div></div>
    <div class="result-card"><div class="result-card-label" style="color:var(--green)">Reconciled</div><div class="result-card-value" style="color:var(--green)">${rs.ok_count||0}</div></div>
    <div class="result-card"><div class="result-card-label" style="color:var(--red)">Exceptions</div><div class="result-card-value" style="color:var(--red)">${rs.exception_count||0}</div></div>

  const files  = data.files  || {};

  const fileHtml = NFS_FILE_DEFS.map(fd => {

    if (err) return `<div style="background:var(--red-bg);border:1px solid #5c2020;border-radius:5px;padding:6px 10px;font-size:10px">

    return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:6px 10px;font-size:10px;display:flex;align-items:center;gap:8px">
      <span class="file-pill ${fd.cls}" style="font-size:8px">${fd.label}</span>
      <span style="color:var(--text2);font-family:var(--mono);font-size:10px;flex:1">${fname||'—'}</span>
      ${fname ? `<span style="color:var(--green);font-size:10px">✓</span>` : ''}
    </div>`;
  }).join('');
  document.getElementById('nfs-file-list').innerHTML = `
    <div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Generated Files</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${fileHtml}</div>`;

  const scenarios = data.scenarios || [];
  const byGroup = {};
  scenarios.forEach(sc => { const g = sc.group||'?'; if (!byGroup[g]) byGroup[g]=[]; byGroup[g].push(sc); });
  let scHtml = `<div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Scenario Breakdown</div>
    <table class="sc-table"><thead><tr>
      <th>Code</th><th>Scenario</th><th>Action</th><th style="text-align:right">Groups</th><th></th>
    </tr></thead><tbody>`;
  for (const [grp, scs] of Object.entries(byGroup)) {
    const grpColor = IDFC_GROUP_COLORS[grp] || 'var(--text2)';
    const grpName  = NFS_GROUP_NAMES[grp] || grp;
    scHtml += `<tr><td colspan="5" style="background:var(--bg);padding:5px 10px;border-top:1px solid var(--border2)">
      <span style="font-family:var(--mono);font-size:10px;font-weight:600;color:${grpColor}">${grp}</span>
      <span style="font-size:10px;color:var(--text2);margin-left:6px">${grpName}</span>
    </td></tr>`;
    scs.forEach(sc => {
      const okBadge = sc.is_ok
        ? `<span style="font-size:9px;padding:1px 4px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid #1a5c3a">OK</span>`
        : `<span style="font-size:9px;padding:1px 4px;border-radius:3px;background:var(--surface2);color:var(--text3);border:1px solid var(--border)">EXC</span>`;
      scHtml += `<tr>
        <td style="font-family:var(--mono);font-size:10px;font-weight:600;color:${grpColor}">${sc.code||''}</td>
        <td style="font-size:11px;color:var(--text)">${sc.name}</td>
        <td style="font-size:10px;color:var(--text2)">${sc.action||''}</td>
        <td style="text-align:right;font-family:var(--mono)">${sc.count}</td>
        <td>${okBadge}</td>
      </tr>`;
    });
  }
  scHtml += '</tbody></table>';
  document.getElementById('nfs-sc-result').innerHTML = scHtml;
  document.getElementById('nfs-results-section').scrollIntoView({ behavior: 'smooth' });
}
