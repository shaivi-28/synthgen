function updateMCOkNote() {
  const vol = parseInt(document.getElementById('mc-volume')?.value || 500);
  const pct = parseInt(document.getElementById('mc-ok-pct')?.value || 95);
  const el  = document.getElementById('mc-ok-pct-val');
  const note = document.getElementById('mc-ok-note');
  if (el) el.textContent = pct + '%';
  if (note) {
    const ok  = Math.round(vol * pct / 100);
    const exc = vol - ok;
    note.textContent = `~${ok} reconciled · ~${exc} exceptions`;
  }
}

function validateMCGl() {
  const gl1 = document.getElementById('mc-gl-dom')?.value.trim() || '';
  const gl2 = document.getElementById('mc-gl-int')?.value.trim() || '';
  const hint = document.getElementById('mc-gl-hint');
  if (!hint) return { ok: true };
  const gls = [gl1, gl2].filter(g => g);
  for (const g of gls) {
    if (!/^\d{8,16}$/.test(g)) {
      hint.textContent = `GL "${g}" must be 8–16 digits`;
      hint.style.color = 'var(--red)';
      return { ok: false };
    }
  }
  hint.textContent = gls.length ? 'GL accounts validated ✓' : 'Leave blank to use config defaults';
  hint.style.color = gls.length ? 'var(--green)' : 'var(--text2)';
  return { ok: true };
}

  const gl2 = document.getElementById('mc-gl-int')?.value.trim() || '';
  const glAccounts = [gl1, gl2].filter(g => g);

  try {
    const res = await fetch('/api/generate-idfc-mc', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        volume: parseInt(document.getElementById('mc-volume').value),
        tran_date: document.getElementById('mc-tran-date').value,
        ok_pct: parseFloat(document.getElementById('mc-ok-pct').value),
        selected_scenarios: mcSelectedScenarios.size > 0 ? [...mcSelectedScenarios] : null,
        gl_accounts: glAccounts,
        no_cbsmcw_duplicates: document.getElementById('mc-no-dup-cbsmcw')?.checked !== false,
      }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Generation failed');
    renderIDFCMCResults(data);
  } catch (e) {
    errBox.textContent = e.message;
    errBox.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>Generate</span>';
  }
}

function renderIDFCMCResults(data) {
  document.getElementById('mc-results-section').classList.remove('hidden');
  const counts = data.counts || {};
  const rs     = data.recon_summary || {};
  const pct    = rs.ok_pct || 0;

  document.getElementById('mc-success-text').textContent =
    `✓ ${counts.total_groups||0} groups — ${pct}% reconciled (${rs.ok_count||0} OK · ${rs.exception_count||0} exceptions)`;

  document.getElementById('mc-download-btn').onclick = () =>
    window.location.href = `/api/download-idfc-mc/${data.run_id}`;

  document.getElementById('mc-result-counts').innerHTML = `
    <div class="result-card"><div class="result-card-label" style="color:var(--green)">Total Groups</div><div class="result-card-value" style="color:var(--green)">${counts.total_groups||0}</div><div style="font-size:10px;color:var(--text3);margin-top:4px">${pct}% reconciled</div></div>
    <div class="result-card"><div class="result-card-label" style="color:var(--green)">Reconciled</div><div class="result-card-value" style="color:var(--green)">${rs.ok_count||0}</div></div>
    <div class="result-card"><div class="result-card-label" style="color:var(--red)">Exceptions</div><div class="result-card-value" style="color:var(--red)">${rs.exception_count||0}</div></div>
    <div class="result-card"><div class="result-card-label" style="color:var(--accent)">POS Groups</div><div class="result-card-value" style="color:var(--accent)">${counts.pos||0}</div></div>
  `;

  const files  = data.files  || {};
  const errors = data.errors || {};
  const fileHtml = MC_FILE_DEFS.map(fd => {
    const fname = files[fd.id];
    const err   = errors[fd.id];
    if (err) return `<div style="background:var(--red-bg);border:1px solid #5c2020;border-radius:5px;padding:6px 10px;font-size:10px">
      <span class="file-pill ${fd.cls}" style="font-size:8px">${fd.label}</span>
      <span style="color:var(--red);margin-left:6px">✗ ${err}</span></div>`;
    return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:6px 10px;font-size:10px;display:flex;align-items:center;gap:8px">
      <span class="file-pill ${fd.cls}" style="font-size:8px">${fd.label}</span>
      <span style="color:var(--text2);font-family:var(--mono);font-size:10px;flex:1">${fname||'—'}</span>
      ${fname ? `<span style="color:var(--green);font-size:10px">✓</span>` : ''}
    </div>`;
  }).join('');
  document.getElementById('mc-file-list').innerHTML = `
    <div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Generated Files</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${fileHtml}</div>`;

  const scenarios = data.scenarios || [];
  const byGroup = {};
  scenarios.forEach(sc => { const g = sc.group||'?'; if (!byGroup[g]) byGroup[g]=[]; byGroup[g].push(sc); });
  let scHtml = `<div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Scenario Breakdown</div>
    <table class="sc-table"><thead><tr>
      <th>Code</th><th>Scenario</th><th>Action</th><th style="text-align:right">Groups</th><th></th>
    </tr></thead><tbody>`;
  for (const [grp, scs] of Object.entries(byGroup)) {
    const grpColor = IDFC_GROUP_COLORS[grp] || 'var(--accent)';
    const grpName  = MC_GROUP_NAMES[grp] || grp;
    scHtml += `<tr><td colspan="5" style="background:var(--bg);padding:5px 10px;border-top:1px solid var(--border2)">
      <span style="font-family:var(--mono);font-size:10px;font-weight:600;color:${grpColor}">${grp}</span>
      <span style="font-size:10px;color:var(--text2);margin-left:6px">${grpName}</span>
    </td></tr>`;
    scs.forEach(sc => {
      const okBadge = sc.is_ok
        ? `<span style="font-size:9px;padding:1px 4px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid #1a5c3a">OK</span>`
        : `<span style="font-size:9px;padding:1px 4px;border-radius:3px;background:var(--surface2);color:var(--text3);border:1px solid var(--border)">EXC</span>`;
      scHtml += `<tr>
        <td style="font-family:var(--mono);font-size:10px;font-weight:600;color:${grpColor}">${sc.code||''}</td>
        <td style="font-size:11px;color:var(--text)">${sc.name}</td>
        <td style="font-size:10px;color:var(--text2)">${sc.action||''}</td>
        <td style="text-align:right;font-family:var(--mono)">${sc.count}</td>
        <td>${okBadge}</td>
      </tr>`;
    });
  }
  scHtml += '</tbody></table>';
  document.getElementById('mc-sc-result').innerHTML = scHtml;
  document.getElementById('mc-results-section').scrollIntoView({ behavior: 'smooth' });
}

let matrixResult = null;

function showMatrixView() {
  selectedUC = null;
  document.querySelectorAll('.uc-item').forEach(el => el.classList.remove('active'));
  document.getElementById('topbar-title').textContent = '64-Case Matrix Generator';
  document.getElementById('topbar-sub').textContent = 'Generate files covering all 64 NFS×Switch×CBS reconciliation combinations';
  document.getElementById('topbar-status').innerHTML = '<span class="status-chip status-active">⊞ MATRIX</span>';
  renderMatrixContent();
}

function valChip(v) {
  if (v === null) return `<span style="font-family:var(--mono);font-size:10px;padding:2px 5px;border-radius:3px;background:var(--surface);color:var(--text3);border:1px solid var(--border)">null</span>`;
  const cfg = {1:['#0a2318','#34d399','#1a5c3a'], [-1]:['#230a0a','#f87171','#5c2020'], 0:['#1a1030','#a78bfa','#2d1e54']};
  const [bg,fg,br] = cfg[v] || ['#1a1030','#a78bfa','#2d1e54'];
  const label = v===1?'+1':v===-1?'−1':'0';
  return `<span style="font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:3px;background:${bg};color:${fg};border:1px solid ${br};font-weight:600">${label}</span>`;
}

function renderMatrixContent() {
  const mc = document.getElementById('main-content');

  // Build case table rows
  const okCount = CASES.filter(c=>c[5]).length;
  const rows = CASES.map(c => {
    const [cid,nv,sv,cv,action,isOk] = c;
    const okBadge = isOk
      ? `<span style="font-size:9px;padding:2px 5px;border-radius:3px;background:var(--green-bg);color:var(--green);border:1px solid #1a5c3a">OK</span>`
      : `<span style="font-size:9px;padding:2px 5px;border-radius:3px;background:var(--surface2);color:var(--text3);border:1px solid var(--border)">EXCEPTION</span>`;
    return `<tr style="border-bottom:0.5px solid var(--border);">
      <td style="padding:5px 10px;font-family:var(--mono);font-size:11px;color:var(--text3)">${cid}</td>
      <td style="padding:5px 8px;text-align:center">${valChip(nv)}</td>
      <td style="padding:5px 8px;text-align:center">${valChip(sv)}</td>
      <td style="padding:5px 8px;text-align:center">${valChip(cv)}</td>
      <td style="padding:5px 10px;font-size:11px;color:var(--text2)">${action}</td>
      <td style="padding:5px 8px;text-align:right">${okBadge}</td>
    </tr>`;
  }).join('');

  mc.innerHTML = `
    <!-- LEGEND -->
    <div class="panel">
      <div class="panel-header"><div class="panel-title">Value Semantics</div></div>
      <div class="panel-body">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
          ${[['NFS','bank debited by NFS','NFS credits bank (reversal)','net zero in NFS'],
             ['Switch','txn approved/forwarded','reversal forwarded','original+rev both present'],
             ['CBS','customer debited','customer credited (refund)','original+rev net zero']].map(([file,p1,m1,z1])=>`
          <div style="background:var(--surface2);border-radius:6px;padding:12px 14px;border:1px solid var(--border)">
            <div style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">${file}</div>
            <div style="font-size:11px;color:var(--text2);display:flex;gap:6px;align-items:center;margin-bottom:4px">${valChip(1)} ${p1}</div>
            <div style="font-size:11px;color:var(--text2);display:flex;gap:6px;align-items:center;margin-bottom:4px">${valChip(-1)} ${m1}</div>
            <div style="font-size:11px;color:var(--text2);display:flex;gap:6px;align-items:center;margin-bottom:4px">${valChip(0)} ${z1}</div>
            <div style="font-size:11px;color:var(--text2);display:flex;gap:6px;align-items:center">${valChip(null)} no entry in file</div>
          </div>`).join('')}
        </div>
      </div>
    </div>

    <!-- GENERATE FORM -->
    <div class="panel">
      <div class="panel-header"><div class="panel-title">Generate Matrix Test Files</div></div>
      <div class="panel-body">
        <div id="matrix-error" class="error-box hidden"></div>
        <div class="form-grid" style="margin-bottom:18px;">
          <div class="form-group">
            <div class="form-label">Transaction Date</div>
            <input class="form-input" type="date" id="m-tran-date" value="${todayStr()}">
          </div>
          <div class="form-group">
            <div class="form-label">Volume (min 64)</div>
            <input class="form-input" type="number" id="m-volume" value="500" min="64" max="50000">
            <div class="form-hint">All 64 cases guaranteed. Remainder fills proportionally.</div>
          </div>

            <div class="form-label">Reconciled % (OK cases)</div>

                style="flex:1;accent-color:var(--accent)" oninput="document.getElementById('m-ok-display').textContent=this.value+'%'">
              <span id="m-ok-display" style="font-family:var(--mono);font-size:15px;color:var(--accent);min-width:42px">99%</span>

                <th style="padding:8px 8px;text-align:center;font-size:10px;color:var(--purple);text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-bottom:1px solid var(--border2)">Switch</th>
                <th style="padding:8px 8px;text-align:center;font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-bottom:1px solid var(--border2)">CBS</th>
                <th style="padding:8px 10px;text-align:left;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-bottom:1px solid var(--border2)">Action</th>

        <div class="panel-header"><div class="panel-title">Coverage Summary</div></div>
        <div class="panel-body">
          <div id="matrix-stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;"></div>
          <div id="matrix-case-dist" style="overflow-x:auto;max-height:360px;overflow-y:auto;"></div>
        </div>
      </div>
    </div>
  `;
}

async function runMatrixGenerate() {
  const btn = document.getElementById('m-generate-btn');
  const errBox = document.getElementById('matrix-error');
  errBox.classList.add('hidden');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div><span>Generating…</span>';

  const volume  = parseInt(document.getElementById('m-volume').value);
  const okPct   = parseFloat(document.getElementById('m-ok-pct').value);
  const tranDate = document.getElementById('m-tran-date').value;

  try {
    const res = await fetch('/api/generate-matrix', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ volume, ok_pct: okPct, tran_date: tranDate }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Generation failed');
    matrixResult = data;
    renderMatrixResults(data);
  } catch(e) {
    errBox.textContent = '✗ ' + e.message;
    errBox.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Generate Matrix Files';
  }
}

function renderMatrixResults(data) {
  document.getElementById('matrix-results').classList.remove('hidden');
  document.getElementById('matrix-success-text').textContent =
    `✓ Generated — ${data.ok_pct_actual}% reconciled (${data.ok_groups} OK groups, ${data.non_ok_groups} exceptions)`;
  document.getElementById('matrix-download-btn').onclick = () => {
    window.location.href = `/api/download-matrix/${data.run_id}`;
  };

  // Stats cards
  const rc = data.row_counts || {};
  document.getElementById('matrix-stats').innerHTML = `
    <div class="result-card"><div class="result-card-label" style="color:var(--green)">OK Groups</div><div class="result-card-value" style="color:var(--green)">${data.ok_groups}</div></div>
    <div class="result-card"><div class="result-card-label" style="color:var(--red)">Exception Groups</div><div class="result-card-value" style="color:var(--red)">${data.non_ok_groups}</div></div>
    <div class="result-card"><div class="result-card-label" style="color:var(--amber)">CBS Rows</div><div class="result-card-value" style="color:var(--amber)">${rc.cbs||0}</div></div>
    <div class="result-card"><div class="result-card-label" style="color:var(--accent)">NFS Rows</div><div class="result-card-value" style="color:var(--accent)">${rc.nfs||0}</div></div>
  `;

  // Case distribution table
  const dist = data.case_distribution || {};
  let th = `<table style="width:100%;border-collapse:collapse;font-size:11px;">
    <thead><tr style="border-bottom:1px solid var(--border2)">
      <th style="padding:6px 8px;text-align:left;color:var(--text3);font-size:10px;text-transform:uppercase">#</th>
      <th style="padding:6px 6px;text-align:center;color:var(--amber);font-size:10px;text-transform:uppercase">NFS</th>
      <th style="padding:6px 6px;text-align:center;color:var(--purple);font-size:10px;text-transform:uppercase">Switch</th>
      <th style="padding:6px 6px;text-align:center;color:var(--accent);font-size:10px;text-transform:uppercase">CBS</th>
      <th style="padding:6px 8px;text-align:left;color:var(--text3);font-size:10px;text-transform:uppercase">Action</th>
      <th style="padding:6px 8px;text-align:right;color:var(--text3);font-size:10px;text-transform:uppercase">Count</th>
    </tr></thead><tbody>`;
  Object.values(dist).forEach(c => {
    const ok = c.is_ok ? `<span style="color:var(--green);font-size:10px">✓</span>` : '';
    th += `<tr style="border-bottom:0.5px solid var(--border)">
      <td style="padding:5px 8px;font-family:var(--mono);color:var(--text3)">${ok} ${c.case_id}</td>
      <td style="padding:5px 6px;text-align:center">${valChip(c.nfs)}</td>
      <td style="padding:5px 6px;text-align:center">${valChip(c.switch)}</td>
      <td style="padding:5px 6px;text-align:center">${valChip(c.cbs)}</td>
      <td style="padding:5px 8px;color:var(--text2)">${c.action}</td>
      <td style="padding:5px 8px;text-align:right;font-family:var(--mono);color:var(--text)">${c.count}</td>
    </tr>`;
  });
  th += '</tbody></table>';
  document.getElementById('matrix-case-dist').innerHTML = th;
  document.getElementById('matrix-results').scrollIntoView({ behavior: 'smooth' });
}
</script>
